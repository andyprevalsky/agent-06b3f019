name: Post-Deploy Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'agents/**'
      - 'back-end/**'
      - 'research/**'
  workflow_dispatch: # Manual trigger from Actions tab

jobs:
  smoke-test:
    name: Agent Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: agents/requirements.txt

      - name: Install dependencies
        run: pip install -r agents/requirements.txt

      - name: Wait for deploys and health check
        env:
          BACKEND_URL: https://navi-j9a9.onrender.com
        run: |
          echo "Waiting 3 minutes for deploys to propagate..."
          sleep 180

          echo "Health-checking backend..."
          for i in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/health" || echo "000")
            if [ "$status" = "200" ]; then
              echo "Backend healthy (attempt $i)"
              exit 0
            fi
            echo "Backend returned $status, retrying in 15s (attempt $i/12)..."
            sleep 15
          done
          echo "Backend health check failed after 3 minutes"
          exit 1

      - name: Run smoke benchmarks
        working-directory: ./agents
        env:
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
          BENCHMARK_BASE_URL: https://navi-j9a9.onrender.com
        run: python benchmarks/run_benchmark.py --suite smoke --parallel --no-retry --ci

      - name: Report results
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## ✅ Smoke tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Smoke tests failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Suite:** smoke (chat-mode, spawn-sub-agents, parallel-tool-calls)" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** https://navi-j9a9.onrender.com" >> $GITHUB_STEP_SUMMARY
