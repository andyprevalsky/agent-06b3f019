name: Deploy checkout authentication probe
on:
  push:
    tags: ['checkout-probes/**']
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        cpu: ['2', '4', '8']
        sample: [1, 2]
    runs-on: blacksmith-${{ matrix.cpu }}vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: useblacksmith/stickydisk@v1
        with:
          key: rose-deploy-gates-git-mirror
          path: /home/runner/rose-git-mirror
          commit: on-change
      - name: Compare authenticated reads without changing permissions
        env:
          FETCH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, re, subprocess, tempfile
          url = 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '.git'
          auth = 'AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + os.environ['FETCH_TOKEN']).encode()).decode()
          mirror = pathlib.Path('/home/runner/rose-git-mirror/rose.git')
          clean = pathlib.Path(tempfile.mkdtemp(prefix='checkout-auth-'))
          subprocess.run(['git', 'init', '--bare', '--quiet', str(clean)], check=True)
          report = {'git': subprocess.check_output(['git', '--version'], text=True).strip(), 'mirror_present': (mirror / 'HEAD').exists(), 'reads': []}
          if not report['mirror_present']:
              mirror = clean
          for name, path in [('mirror', mirror), ('isolated', clean), ('mirror-control', mirror)]:
              env = os.environ.copy()
              if name == 'isolated':
                  env = {k: v for k, v in env.items() if not k.startswith('GIT_CONFIG_')}
                  env.update(GIT_CONFIG_GLOBAL='/dev/null', GIT_CONFIG_SYSTEM='/dev/null')
              command = ['git', '-C', str(path), '-c', 'http.extraheader=' + auth]
              effective = subprocess.run(command + ['config', '--get-urlmatch', 'http.extraheader', url], env=env, text=True, capture_output=True)
              headers = [line for line in effective.stdout.splitlines() if line.lower().startswith('authorization:')]
              env.update(GIT_TRACE_CURL='1', GIT_TRACE_CURL_NO_DATA='1', GIT_TRACE_REDACT='1', GIT_TERMINAL_PROMPT='0')
              try:
                  read = subprocess.run(command + ['ls-remote', url, 'HEAD'], env=env, text=True, capture_output=True, timeout=45)
                  code, stdout, stderr = read.returncode, read.stdout, read.stderr
              except subprocess.TimeoutExpired as error:
                  code, stdout = 124, ''
                  stderr = error.stderr or ''
                  if isinstance(stderr, bytes):
                      stderr = stderr.decode('utf-8', errors='replace')
              response_headers = [line.split('<= Recv header:', 1)[1].strip() for line in stderr.splitlines() if '<= Recv header:' in line and re.search(r'(HTTP/|x-github-request-id:)', line, re.I)]
              report['reads'].append({'context': name, 'effective_authorization_count': len(headers), 'effective_authorization_is_current': headers == [auth], 'config_exit': effective.returncode, 'exit': code, 'response_headers': response_headers, 'repository_answered': bool(stdout.strip())})
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'checkout-probe'
          output.mkdir(exist_ok=True)
          (output / 'report.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkout-probe-${{ matrix.cpu }}-${{ matrix.sample }}
          path: ${{ runner.temp }}/checkout-probe/report.json
