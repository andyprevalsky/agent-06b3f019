name: Auto RCA — shipped notice

on:
  pull_request:
    types: [closed]

jobs:
  shipped:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'auto-rca/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      PROD_BACKEND_URL: https://navi-j9a9.onrender.com

    steps:
      - name: Checkout trusted lifecycle code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Install trusted lifecycle broker
        run: sudo install -o root -g root -m 0555 scripts/auto-rca-tool /usr/local/bin/rose-auto-rca-tool

      - name: Resolve shipped RCA context
        shell: bash
        run: |
          set -euo pipefail
          marker="$(printf '%s' "$PR_BODY" | grep -oE '<!-- rca-slack ts=[^ ]+ channel=[^ ]+( agent=[^ ]+ run=[^ ]+)? -->' | head -1 || true)"
          [ -n "$marker" ] || { echo "Merged auto-RCA PR has no lifecycle marker" >&2; exit 1; }
          slack_ts="$(printf '%s' "$marker" | sed -nE 's/.*ts=([^ ]+).*/\1/p')"
          slack_channel="$(printf '%s' "$marker" | sed -nE 's/.*channel=([^ ]+).*/\1/p')"
          agent_id="$(printf '%s' "$marker" | sed -nE 's/.*agent=([^ ]+).*/\1/p')"
          run_id="$(printf '%s' "$marker" | sed -nE 's/.*run=([^ ]+).*/\1/p')"
          if [ -z "$agent_id" ]; then
            agent_id="$(printf '%s' "$PR_TITLE" | grep -oE '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}' | head -1)"
          fi
          if [ -z "$run_id" ]; then
            run_id="$(printf '%s' "$PR_BODY" | grep -oE 'actions/runs/[0-9]+' | tail -1 | cut -d/ -f3)"
          fi
          branch="$PR_BRANCH"
          short_id="$(printf '%s' "$agent_id" | tr -cd 'a-zA-Z0-9' | cut -c1-12)"
          if [ "$branch" != "auto-rca/$agent_id" ] && ! [[ "$branch" =~ ^auto-rca/${short_id}-[0-9]+$ ]]; then
            echo "RCA branch does not match its agent" >&2; exit 1
          fi
          [[ "$slack_ts" =~ ^[0-9]{10,}\.[0-9]{6}$ ]] || { echo "Invalid Slack timestamp" >&2; exit 1; }
          [[ "$slack_channel" =~ ^[A-Z0-9]{9,32}$ ]] || { echo "Invalid Slack channel" >&2; exit 1; }
          [[ "$agent_id" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]] || { echo "Invalid agent ID" >&2; exit 1; }
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "Invalid RCA run ID" >&2; exit 1; }
          {
            printf 'SLACK_TS=%s\n' "$slack_ts"
            printf 'SLACK_CHANNEL=%s\n' "$slack_channel"
            printf 'AGENT_ID=%s\n' "$agent_id"
            printf 'RCA_RUN_URL=https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$run_id"
          } >> "$GITHUB_ENV"

      - name: Resolve affected user
        shell: bash
        env:
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: |
          set -uo pipefail
          response="$(curl -fsS --retry 3 --retry-all-errors --connect-timeout 5 --max-time 20 \
            "$PROD_BACKEND_URL/api/agents/$AGENT_ID/alert-context" \
            -H "X-API-Key: $BACKEND_API_KEY" 2>/dev/null || true)"
          affected_user_name="$(printf '%s' "$response" | jq -r '.affected_user_name // empty' 2>/dev/null || true)"
          affected_user_name="$(printf '%s' "$affected_user_name" | tr '\r\n\t' '   ' | tr -s ' ' \
            | sed 's/^ *//; s/ *$//; s/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' | cut -c1-160)"
          [ -n "$affected_user_name" ] || affected_user_name='Affected user unavailable'
          printf 'AFFECTED_USER_NAME=%s\n' "$affected_user_name" >> "$GITHUB_ENV"

      - name: Edit the same Slack card to shipped
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          RCA_STATE: shipped
          RCA_FE_URL: https://roselabs.ai/?agent-id=${{ env.AGENT_ID }}
          RCA_PR_URL: ${{ github.event.pull_request.html_url }}
        run: /usr/local/bin/rose-auto-rca-tool slack-update
