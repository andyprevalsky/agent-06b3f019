name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  # Deep review on new/reopened PRs — more turns, full analysis
  deep-review:
    if: |
      github.event.action == 'opened' ||
      github.event.action == 'reopened' ||
      github.event.action == 'ready_for_review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deep review (new PR)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          dangerously_skip_permissions: true
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment

            ## Review priorities (in order)

            1. **Critical bugs** — race conditions, null derefs, unhandled errors that will crash in prod, broken control flow, data corruption paths. Ignore trivial/cosmetic bugs.
            2. **Architectural issues** — short-sighted patterns that create tech debt, wrong abstraction boundaries, violations of existing patterns (e.g. Temporal determinism, idempotent activities, ToolManager pattern). Flag code that will be painful to build on.
            3. **Security risks** — injection, auth bypass, secret leakage, OWASP top 10. Check for hardcoded credentials, unsafe input handling, missing auth checks.
            4. **Convention adherence** — TypeScript typing (no `any` without justification), logging guidelines (component prefix, IDs, truncated payloads), structured error handling (catch → format → yield, don't raise).

            ## What to SKIP
            - Style nits (formatting, naming preferences, comment quality)
            - Minor refactoring suggestions
            - "Nice to have" improvements
            - Obvious or low-impact bugs that won't affect prod

            ## How to report
            - Post findings as inline review comments on the specific lines
            - Lead each comment with severity: 🔴 critical, 🟡 warning, 🔵 convention
            - Keep comments concise — state the problem and why it matters, suggest a fix only if non-obvious
            - If the PR looks solid, say so briefly and approve — don't manufacture feedback

            Read and follow the project's CLAUDE.md for all project-specific rules and patterns.
          claude_args: "--model opus --effort max"
          show_full_output: true

  # Fast review on subsequent pushes — diff-only
  incremental-review:
    if: github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Incremental review (new commits)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          dangerously_skip_permissions: true
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment

            This is an incremental review — new commits were pushed to an existing PR.
            Focus ONLY on the new changes. Be fast and targeted.

            Flag only:
            - 🔴 Critical bugs that will break prod
            - 🔴 Security vulnerabilities
            - 🟡 Architectural regressions or pattern violations (Temporal determinism, idempotent activities, etc.)
            - 🔵 Missing logging or typing violations only if egregious

            Skip everything else. If the new commits look fine, approve with a one-liner.

            Read and follow the project's CLAUDE.md for all project-specific rules and patterns.
          claude_args: "--model opus --effort medium"
          show_full_output: true
