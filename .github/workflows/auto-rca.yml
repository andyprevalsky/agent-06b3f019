name: Auto RCA
run-name: >-
  Auto RCA · ${{ github.event.client_payload.agent_id || inputs.agent_id ||
  github.event.issue.title || github.run_id }}

# State machine:
# failure -> one draft PR + one Slack card -> running/revising -> blocked|ready
# -> ordinary Slack thread reply or top-level PR comment -> revising
# -> blocked|ready -> exact-head human approval -> merge -> shipped, or close
# without merge -> cancelled. A trusted verifier, not investigator prose, owns
# every transition, exact step result, and duration out of draft.

on:
  repository_dispatch:
    types: [agent-failure]
  workflow_dispatch:
    inputs:
      agent_id:
        description: Failing agent ID to RCA
        required: true
        type: string
      affected_user_name:
        description: Affected user name for a retained alert whose agent record expired
        required: false
        type: string
  issue_comment:
    types: [created]

concurrency:
  group: "auto-rca-${{ github.event.issue.title || format('auto-RCA: Production agent failure {0}', github.event.client_payload.agent_id || inputs.agent_id || github.run_id) }}"
  cancel-in-progress: false

jobs:
  rca:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
      github.event.comment.user.type == 'User' &&
      !contains(github.event.comment.body, '<!-- rca-feedback-consumed'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: victoria
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d victoria"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    permissions:
      actions: read
      contents: write
      id-token: write
      issues: write
      pull-requests: write

    env:
      INITIAL_AGENT_ID: ${{ github.event.client_payload.agent_id || inputs.agent_id }}
      DISPATCH_AFFECTED_USER_NAME: ${{ github.event.client_payload.affected_user_name || inputs.affected_user_name }}
      DISPATCH_SLACK_TS: ${{ github.event.client_payload.slack_ts }}
      DISPATCH_SLACK_CHANNEL: ${{ github.event.client_payload.slack_channel }}
      PROD_BACKEND_URL: https://navi-j9a9.onrender.com
      AUTO_RCA_ROOT_DIR: ${{ github.workspace }}
      AUTO_RCA_GATE_STATE_DIR: /var/lib/rose-auto-rca/${{ github.run_id }}

    steps:
      - name: Checkout trusted lifecycle code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install trusted RCA lifecycle code
        shell: bash
        run: |
          set -euo pipefail
          if ! id -u rose-auto-rca >/dev/null 2>&1; then
            sudo useradd --system --create-home --shell /bin/bash rose-auto-rca
          fi
          sudo install -o root -g root -m 0555 scripts/auto-rca-tool /usr/local/bin/rose-auto-rca-tool
          sudo install -o root -g root -m 0444 .github/auto-rca-prompt.txt /usr/local/share/rose-auto-rca-prompt.txt
          sudo install -d -o root -g rose-auto-rca -m 0750 "$AUTO_RCA_GATE_STATE_DIR"

      - name: Resolve and validate lifecycle context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          DEFAULT_SLACK_CHANNEL: ${{ secrets.SLACK_ERROR_CHANNEL_ID }}
        run: |
          set -euo pipefail
          uuid_re='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          extract_marker() {
            printf '%s' "$1" | grep -oE '<!-- rca-slack ts=[^ ]* channel=[^ ]*( agent=[^ ]+ run=[^ ]+)? -->' | head -1 || true
          }
          if [ "$EVENT_NAME" = issue_comment ]; then
            [[ "$COMMENT_PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "Invalid PR number" >&2; exit 1; }
            [[ "$COMMENT_ID" =~ ^[0-9]+$ ]] || { echo "Invalid feedback comment ID" >&2; exit 1; }
            permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$COMMENT_AUTHOR/permission" --jq '.permission')"
            case "$permission" in admin|maintain) ;; *) echo "RCA feedback requires maintain permission" >&2; exit 1 ;; esac
            pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$COMMENT_PR_NUMBER")"
            [ "$(printf '%s' "$pr" | jq -r '.state')" = open ] || { echo "RCA PR is not open" >&2; exit 1; }
            [ "$(printf '%s' "$pr" | jq -r '.base.ref')" = main ] || { echo "RCA PR must target main" >&2; exit 1; }
            [ "$(printf '%s' "$pr" | jq -r '.head.repo.full_name')" = "$GITHUB_REPOSITORY" ] || { echo "Fork RCA PRs are not trusted" >&2; exit 1; }
            title="$(printf '%s' "$pr" | jq -r '.title')"
            agent_id="${title#auto-RCA: Production agent failure }"
            [[ "$agent_id" =~ $uuid_re ]] || { echo "RCA PR title has no exact agent UUID" >&2; exit 1; }
            [ "$title" = "auto-RCA: Production agent failure $agent_id" ] || { echo "RCA PR title is not canonical" >&2; exit 1; }
            short_id="$(printf '%s' "$agent_id" | tr -cd 'a-zA-Z0-9' | cut -c1-12)"
            branch="$(printf '%s' "$pr" | jq -r '.head.ref')"
            if [ "$branch" != "auto-rca/$agent_id" ] && ! [[ "$branch" =~ ^auto-rca/${short_id}-[0-9]+$ ]]; then
              echo "RCA branch does not match its agent" >&2; exit 1
            fi
            body="$(printf '%s' "$pr" | jq -r '.body // ""')"
            marker="$(extract_marker "$body")"
            marker_agent="$(printf '%s' "$marker" | sed -nE 's/.* agent=([^ ]+) run=.*/\1/p')"
            marker_run="$(printf '%s' "$marker" | sed -nE 's/.* run=([^ ]+) -->/\1/p')"
            [ -z "$marker_agent" ] || [ "$marker_agent" = "$agent_id" ] || { echo "RCA marker agent mismatch" >&2; exit 1; }
            [ -z "$marker_run" ] || [[ "$marker_run" =~ ^[0-9]+$ ]] || { echo "RCA marker run is invalid" >&2; exit 1; }
            slack_ts="$(printf '%s' "$marker" | sed -nE 's/.*ts=([^ ]*).*/\1/p')"
            slack_channel="$(printf '%s' "$marker" | sed -nE 's/.*channel=([^ ]*).*/\1/p')"
            pr_url="$(printf '%s' "$pr" | jq -r '.html_url')"
            checkout_ref="refs/pull/$COMMENT_PR_NUMBER/head"
            read -r mode noop < <(EVENT_NAME="$EVENT_NAME" /usr/local/bin/rose-auto-rca-tool dispatch-plan)
            comment_pages="$(gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/issues/$COMMENT_PR_NUMBER/comments?per_page=100")"
            feedback_batch="$(printf '%s' "$comment_pages" | \
              TRIGGER_COMMENT_ID="$COMMENT_ID" SLACK_CHANNEL="$slack_channel" \
              SLACK_THREAD_TS="$slack_ts" /usr/local/bin/rose-auto-rca-tool feedback-batch)"
            authorized_feedback='[]'
            unauthorized_feedback_ids='[]'
            while IFS= read -r feedback_item; do
              feedback_author="$(printf '%s' "$feedback_item" | jq -r '.author')"
              if ! permission="$(gh api \
                "repos/$GITHUB_REPOSITORY/collaborators/$feedback_author/permission" \
                --jq '.permission')"; then
                echo "Could not verify queued RCA feedback permission for $feedback_author" >&2
                exit 1
              fi
              case "$permission" in
                admin|maintain)
                  authorized_feedback="$(printf '%s' "$authorized_feedback" | \
                    jq -c --argjson item "$feedback_item" '. + [$item]')"
                  ;;
                pull|triage|read|none)
                  unauthorized_feedback_ids="$(printf '%s' "$unauthorized_feedback_ids" | \
                    jq -c --argjson id "$(printf '%s' "$feedback_item" | jq '.id')" '. + [$id]')"
                  ;;
                *)
                  echo "Unexpected queued RCA feedback permission for $feedback_author: $permission" >&2
                  exit 1
                  ;;
              esac
            done < <(printf '%s' "$feedback_batch" | jq -c '.[]')
            unauthorized_feedback_csv="$(printf '%s' "$unauthorized_feedback_ids" | jq -r 'join(",")')"
            if [ -n "$unauthorized_feedback_csv" ]; then
              marker="<!-- rca-feedback-consumed ids=$unauthorized_feedback_csv run=$GITHUB_RUN_ID -->"
              gh api "repos/$GITHUB_REPOSITORY/issues/$COMMENT_PR_NUMBER/comments" \
                --method POST --raw-field "body=$marker" >/dev/null
            fi
            feedback_batch="$authorized_feedback"
            if [ "$(printf '%s' "$feedback_batch" | jq 'length')" -eq 0 ]; then
              noop=true
            fi
            feedback_b64="$(printf '%s' "$feedback_batch" | python3 -c 'import base64,json,sys; items=json.load(sys.stdin); lines=["- {} feedback from {}: {}".format("Slack" if item["source"] == "slack" else "GitHub", item["author"], item["text"]) for item in items]; print(base64.b64encode("\n".join(lines).encode()).decode())')"
            feedback_comment_ids="$(printf '%s' "$feedback_batch" | jq -r 'map(.id | tostring) | join(",")')"
            feedback_slack_users="$(printf '%s' "$feedback_batch" | jq -r \
              '[.[] | select(.source == "slack") | .slack_user] | unique | join(",")')"
          else
            agent_id="${INITIAL_AGENT_ID:-}"
            [[ "$agent_id" =~ $uuid_re ]] || { echo "agent_id must be a UUID" >&2; exit 1; }
            title="auto-RCA: Production agent failure $agent_id"
            open_pr_pages="$(gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100")"
            matching_prs="$(printf '%s' "$open_pr_pages" | AGENT_ID="$agent_id" \
              /usr/local/bin/rose-auto-rca-tool select-agent-prs)"
            existing="$(printf '%s' "$matching_prs" | jq -c '.[0] // empty')"
            if [ -n "$existing" ]; then
              branch="$(printf '%s' "$existing" | jq -r '.headRefName')"
              short_id="$(printf '%s' "$agent_id" | tr -cd 'a-zA-Z0-9' | cut -c1-12)"
              if [ "$branch" != "auto-rca/$agent_id" ] && ! [[ "$branch" =~ ^auto-rca/${short_id}-[0-9]+$ ]]; then
                echo "Existing RCA branch does not match its agent" >&2; exit 1
              fi
              body="$(printf '%s' "$existing" | jq -r '.body // ""')"
              marker="$(extract_marker "$body")"
              marker_agent="$(printf '%s' "$marker" | sed -nE 's/.* agent=([^ ]+) run=.*/\1/p')"
              [ -z "$marker_agent" ] || [ "$marker_agent" = "$agent_id" ] || { echo "Existing RCA marker agent mismatch" >&2; exit 1; }
              slack_ts="$(printf '%s' "$marker" | sed -nE 's/.*ts=([^ ]*).*/\1/p')"
              slack_channel="$(printf '%s' "$marker" | sed -nE 's/.*channel=([^ ]*).*/\1/p')"
              pr_url="$(printf '%s' "$existing" | jq -r '.url')"
              checkout_ref="$branch"
              existing_is_draft="$(printf '%s' "$existing" | jq -r '.isDraft')"
              read -r mode noop < <(EVENT_NAME="$EVENT_NAME" EXISTING_PR_FOUND=true \
                EXISTING_PR_IS_DRAFT="$existing_is_draft" /usr/local/bin/rose-auto-rca-tool dispatch-plan)
            else
              branch="auto-rca/$agent_id"
              slack_ts="${DISPATCH_SLACK_TS:-}"
              slack_channel="${DISPATCH_SLACK_CHANNEL:-$DEFAULT_SLACK_CHANNEL}"
              pr_url=''
              checkout_ref=main
              read -r mode noop < <(EVENT_NAME="$EVENT_NAME" EXISTING_PR_FOUND=false \
                /usr/local/bin/rose-auto-rca-tool dispatch-plan)
            fi
            feedback_b64=''
            feedback_comment_ids=''
            feedback_slack_users=''
          fi
          [[ "$agent_id" =~ $uuid_re ]] || { echo "agent_id must be a UUID" >&2; exit 1; }
          if [ -n "$slack_ts" ] && ! [[ "$slack_ts" =~ ^[0-9]{10,}\.[0-9]{6}$ ]]; then
            echo "slack_ts must be a Slack message timestamp" >&2; exit 1
          fi
          if [ -n "$slack_channel" ] && ! [[ "$slack_channel" =~ ^[A-Z0-9]{9,32}$ ]]; then
            echo "slack_channel must be a Slack channel ID" >&2; exit 1
          fi
          {
            printf 'AGENT_ID=%s\n' "$agent_id"
            printf 'RCA_BRANCH=%s\n' "$branch"
            printf 'RCA_CHECKOUT_REF=%s\n' "$checkout_ref"
            printf 'RCA_MODE=%s\n' "$mode"
            printf 'RCA_NOOP=%s\n' "$noop"
            printf 'RCA_PR_URL=%s\n' "$pr_url"
            printf 'RCA_PR_NUMBER=%s\n' "${COMMENT_PR_NUMBER:-}"
            printf 'SLACK_TS=%s\n' "$slack_ts"
            printf 'SLACK_CHANNEL=%s\n' "$slack_channel"
            printf 'RCA_REVIEW_FEEDBACK_B64=%s\n' "$feedback_b64"
            printf 'RCA_FEEDBACK_COMMENT_IDS=%s\n' "$feedback_comment_ids"
            printf 'RCA_FEEDBACK_SLACK_USERS=%s\n' "$feedback_slack_users"
          } >> "$GITHUB_ENV"

      - name: Resolve affected user
        shell: bash
        env:
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: |
          set -uo pipefail
          response="$(curl -fsS --retry 3 --retry-all-errors --connect-timeout 5 --max-time 20 \
            "$PROD_BACKEND_URL/api/agents/$AGENT_ID/alert-context" \
            -H "X-API-Key: $BACKEND_API_KEY" 2>/dev/null || true)"
          affected_user_name="$(printf '%s' "$response" | jq -r '.affected_user_name // empty' 2>/dev/null || true)"
          [ -n "$affected_user_name" ] || affected_user_name="${DISPATCH_AFFECTED_USER_NAME:-}"
          affected_user_name="$(printf '%s' "$affected_user_name" | tr '\r\n\t' '   ' | tr -s ' ' \
            | sed 's/^ *//; s/ *$//; s/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' | cut -c1-160)"
          [ -n "$affected_user_name" ] || affected_user_name='Affected user unavailable'
          printf 'AFFECTED_USER_NAME=%s\n' "$affected_user_name" >> "$GITHUB_ENV"

      - name: Slack — immediately mark reviewer feedback in progress
        id: slack_revision_active
        if: env.RCA_MODE == 'revision' && env.RCA_NOOP != 'true' && env.SLACK_CHANNEL != ''
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          RCA_RECONCILE_SLACK: ${{ env.SLACK_TS == '' && 'true' || 'false' }}
          RCA_STATE: revising
          RCA_FE_URL: https://roselabs.ai/?agent-id=${{ env.AGENT_ID }}
          RCA_PR_URL: ${{ env.RCA_PR_URL }}
          RCA_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: /usr/local/bin/rose-auto-rca-tool slack-update

      - name: Checkout RCA target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RCA_CHECKOUT_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare RCA branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR_ID" =~ ^[0-9]+$ ]] || {
            echo 'GitHub actor ID is required for an attributable RCA commit.' >&2
            exit 1
          }
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          if [ "$RCA_MODE" = initial ]; then
            git checkout -b "$RCA_BRANCH"
          else
            git checkout -B "$RCA_BRANCH"
          fi

      - name: Create or reopen the draft PR
        id: begin
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_UPDATE_TOKEN }}
          AUTO_RCA_PR_TOKEN: ${{ secrets.GH_UPDATE_TOKEN }}
        run: |
          if [ "$RCA_NOOP" = true ]; then
            printf 'pr_url=%s\n' "$RCA_PR_URL" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$RCA_PR_URL"
          else
            /usr/local/bin/rose-auto-rca-tool begin-draft
          fi

      - name: Slack — mark investigation active
        id: slack_active
        if: env.SLACK_CHANNEL != '' && env.RCA_NOOP != 'true' && env.RCA_MODE != 'revision'
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          RCA_RECONCILE_SLACK: ${{ env.RCA_MODE != 'initial' && env.SLACK_TS == '' && 'true' || 'false' }}
          RCA_STATE: running
          RCA_FE_URL: https://roselabs.ai/?agent-id=${{ env.AGENT_ID }}
          RCA_PR_URL: ${{ steps.begin.outputs.pr_url }}
          RCA_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: /usr/local/bin/rose-auto-rca-tool slack-update

      - name: Bind Slack lifecycle handle to the PR
        if: steps.slack_active.outcome == 'success' || steps.slack_revision_active.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_UPDATE_TOKEN }}
          AUTO_RCA_PR_TOKEN: ${{ secrets.GH_UPDATE_TOKEN }}
        run: /usr/local/bin/rose-auto-rca-tool bind-slack

      - name: Sync revision branch with current main
        if: env.RCA_MODE != 'initial' && env.RCA_NOOP != 'true'
        shell: bash
        run: git -c core.hooksPath=/dev/null merge --no-edit origin/main

      - name: Pin trusted baseline and Git configuration
        if: env.RCA_NOOP != 'true'
        shell: bash
        run: /usr/local/bin/rose-auto-rca-tool pin-baseline

      - name: Timeline — start production evidence
        id: timeline_evidence_start
        if: env.RCA_NOOP != 'true'
        shell: bash
        env:
          RCA_TIMELINE_STEP: rca-evidence
        run: /usr/local/bin/rose-auto-rca-tool timeline-start

      - name: Collect production evidence outside the investigator process
        id: evidence
        if: env.RCA_NOOP != 'true'
        continue-on-error: true
        shell: bash
        env:
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
          CLICKHOUSE_ENDPOINT: ${{ secrets.CLICKHOUSE_ENDPOINT }}
          CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
        run: /usr/local/bin/rose-auto-rca-tool collect-evidence

      - name: Timeline — finish production evidence
        if: always() && steps.timeline_evidence_start.outcome == 'success'
        shell: bash
        env:
          RCA_TIMELINE_STEP: rca-evidence
          RCA_TIMELINE_STATUS: ${{ steps.evidence.outcome == 'success' && 'passed' || 'failed' }}
        run: /usr/local/bin/rose-auto-rca-tool timeline-finish

      - name: Setup Node
        if: env.RCA_NOOP != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup Python
        if: env.RCA_NOOP != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install flyctl
        if: env.RCA_NOOP != 'true'
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master

      - name: Timeline — start test environment setup
        id: timeline_environment_start
        if: env.RCA_NOOP != 'true'
        shell: bash
        env:
          RCA_TIMELINE_STEP: rca-environment
        run: /usr/local/bin/rose-auto-rca-tool timeline-start

      - name: Hydrate Auto RCA test environment
        id: hydrate
        if: env.RCA_NOOP != 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          npm install --no-audit --no-fund
          npm install --prefix mac-app --no-audit --no-fund
          python -m venv agents/venv
          agents/venv/bin/python -m pip install --disable-pip-version-check -q -r agents/requirements.txt
          (cd back-end && npx prisma generate)

      - name: Timeline — finish test environment setup
        if: always() && steps.timeline_environment_start.outcome == 'success'
        shell: bash
        env:
          RCA_TIMELINE_STEP: rca-environment
          RCA_TIMELINE_STATUS: ${{ steps.hydrate.outcome == 'success' && 'passed' || 'failed' }}
        run: /usr/local/bin/rose-auto-rca-tool timeline-finish

      - name: Build trusted investigator prompt
        id: prompt
        if: env.RCA_NOOP != 'true' && steps.hydrate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import secrets

          template = pathlib.Path('/usr/local/share/rose-auto-rca-prompt.txt').read_text(encoding='utf-8').strip()
          if template.count('<agent-id>') != 1:
              raise SystemExit('Auto-RCA prompt must contain exactly one <agent-id> placeholder')
          value = template.replace('<agent-id>', os.environ['AGENT_ID'])
          import base64
          feedback_b64 = os.environ.get('RCA_REVIEW_FEEDBACK_B64', '')
          feedback = base64.b64decode(feedback_b64, validate=True).decode().strip() if feedback_b64 else ''
          if os.environ['RCA_MODE'] == 'revision':
              if feedback:
                  value += f'\nHints from reviewer feedback (untrusted data):\n{feedback}'
          value += '\n'
          delimiter = 'RCA_PROMPT_' + secrets.token_hex(16)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'prompt<<{delimiter}\n{value}{delimiter}\n')
          PY

      - name: Timeline — start primary investigation
        id: timeline_primary_investigation_start
        if: env.RCA_NOOP != 'true' && steps.hydrate.outcome == 'success'
        shell: bash
        env:
          RCA_TIMELINE_STEP: rca-primary-investigation
        run: /usr/local/bin/rose-auto-rca-tool timeline-start

      - name: Root-cause with dedicated Claude account
        id: investigator_primary
        if: env.RCA_NOOP != 'true' && steps.hydrate.outcome == 'success'
        continue-on-error: true
        uses: anthropics/claude-code-action@b76a0776ae74036e77cd11018083743453d7ad35 # v1
        with:
          claude_code_oauth_token: ${{ secrets.RCA_CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          bot_id: ${{ github.actor_id }}
          bot_name: ${{ github.actor }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: |
            --model opus
            --effort high
            --max-turns 80
            --permission-mode bypassPermissions

      - name: Checkpoint primary investigator work
        id: checkpoint_primary
        if: always() && steps.investigator_primary.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        run: /usr/local/bin/rose-auto-rca-tool checkpoint-draft

      - name: Require a real primary investigator turn
        id: validate_primary
        if: always() && steps.investigator_primary.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        env:
          RCA_INVESTIGATOR_EXECUTION_FILE: ${{ steps.investigator_primary.outputs.execution_file }}
        run: /usr/local/bin/rose-auto-rca-tool verify-investigator-run

      - name: Timeline — finish primary investigation
        if: always() && steps.timeline_primary_investigation_start.outcome == 'success'
        shell: bash
        env:
          RCA_TIMELINE_STEP: rca-primary-investigation
          RCA_TIMELINE_STATUS: ${{ steps.checkpoint_primary.outcome == 'success' && steps.validate_primary.outcome == 'success' && 'passed' || 'failed' }}
        run: /usr/local/bin/rose-auto-rca-tool timeline-finish

      - name: Timeline — start primary reproduction
        id: timeline_primary_reproduction_start
        if: always() && steps.checkpoint_primary.outcome == 'success' && steps.validate_primary.outcome == 'success'
        shell: bash
        env:
          RCA_TIMELINE_STEP: rca-primary-reproduction
        run: /usr/local/bin/rose-auto-rca-tool timeline-start

      - name: Verify unchanged reproduction after primary attempt
        id: repro_primary
        if: always() && steps.checkpoint_primary.outcome == 'success' && steps.validate_primary.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: /usr/local/bin/rose-auto-rca-tool verify-repro

      - name: Timeline — finish primary reproduction
        if: always() && steps.timeline_primary_reproduction_start.outcome == 'success'
        shell: bash
        env:
          RCA_TIMELINE_STEP: rca-primary-reproduction
          RCA_TIMELINE_STATUS: ${{ steps.repro_primary.outcome == 'success' && 'passed' || 'failed' }}
        run: /usr/local/bin/rose-auto-rca-tool timeline-finish

      - name: Timeline — start primary offline deploy gates
        id: timeline_primary_offline_start
        if: steps.repro_primary.outcome == 'success'
        shell: bash
        env:
          RCA_TIMELINE_STEP: deploy-primary-offline
        run: /usr/local/bin/rose-auto-rca-tool timeline-start

      - name: Run offline gate after primary attempt
        id: offline_primary
        if: steps.repro_primary.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
          BACKEND_CODEX_TOKEN_SYNC_SKIP: "1"
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          NODE_ENV: test
          SUPABASE_JWT_SECRET: auto-rca-local-jwt-secret-32-bytes
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_BACKEND_API_URL: http://127.0.0.1:3001
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: /usr/local/bin/rose-auto-rca-tool offline-gates

      - name: Timeline — finish primary offline deploy gates
        if: always() && steps.timeline_primary_offline_start.outcome == 'success'
        shell: bash
        env:
          RCA_TIMELINE_STEP: deploy-primary-offline
          RCA_TIMELINE_STATUS: ${{ steps.offline_primary.outcome == 'success' && 'passed' || 'failed' }}
        run: /usr/local/bin/rose-auto-rca-tool timeline-finish

      - name: Timeline — start primary smoke deploy gates
        id: timeline_primary_smoke_start
        if: steps.offline_primary.outcome == 'success'
        shell: bash
        env:
          RCA_TIMELINE_STEP: deploy-primary-smoke
        run: /usr/local/bin/rose-auto-rca-tool timeline-start

      - name: Run smoke gate after primary attempt
        id: smoke_primary
        if: steps.offline_primary.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: /usr/local/bin/rose-auto-rca-tool smoke-gates

      - name: Timeline — finish primary smoke deploy gates
        if: always() && steps.timeline_primary_smoke_start.outcome == 'success'
        shell: bash
        env:
          RCA_TIMELINE_STEP: deploy-primary-smoke
          RCA_TIMELINE_STATUS: ${{ steps.smoke_primary.outcome == 'success' && 'passed' || 'failed' }}
        run: /usr/local/bin/rose-auto-rca-tool timeline-finish

      - name: Check primary completion contract
        id: primary_contract
        if: always() && env.RCA_NOOP != 'true'
        shell: bash
        run: /usr/local/bin/rose-auto-rca-tool completion-status

      - name: Timeline — start retry investigation
        id: timeline_retry_investigation_start
        if: always() && env.RCA_NOOP != 'true' && steps.hydrate.outcome == 'success' && steps.primary_contract.outputs.complete != 'true'
        shell: bash
        env:
          RCA_TIMELINE_STEP: rca-retry-investigation
        run: /usr/local/bin/rose-auto-rca-tool timeline-start

      - name: Retry incomplete RCA with secondary Claude account
        id: investigator_retry
        if: always() && env.RCA_NOOP != 'true' && steps.hydrate.outcome == 'success' && steps.primary_contract.outputs.complete != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@b76a0776ae74036e77cd11018083743453d7ad35 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          bot_id: ${{ github.actor_id }}
          bot_name: ${{ github.actor }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: |
            --model opus
            --effort high
            --max-turns 80
            --permission-mode bypassPermissions

      - name: Checkpoint retry investigator work
        id: checkpoint_retry
        if: always() && steps.investigator_retry.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        run: /usr/local/bin/rose-auto-rca-tool checkpoint-draft

      - name: Require a real retry investigator turn
        id: validate_retry
        if: always() && steps.investigator_retry.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        env:
          RCA_INVESTIGATOR_EXECUTION_FILE: ${{ steps.investigator_retry.outputs.execution_file }}
        run: /usr/local/bin/rose-auto-rca-tool verify-investigator-run

      - name: Timeline — finish retry investigation
        if: always() && steps.timeline_retry_investigation_start.outcome == 'success'
        shell: bash
        env:
          RCA_TIMELINE_STEP: rca-retry-investigation
          RCA_TIMELINE_STATUS: ${{ steps.checkpoint_retry.outcome == 'success' && steps.validate_retry.outcome == 'success' && 'passed' || 'failed' }}
        run: /usr/local/bin/rose-auto-rca-tool timeline-finish

      - name: Timeline — start retry reproduction
        id: timeline_retry_reproduction_start
        if: always() && steps.checkpoint_retry.outcome == 'success' && steps.validate_retry.outcome == 'success'
        shell: bash
        env:
          RCA_TIMELINE_STEP: rca-retry-reproduction
        run: /usr/local/bin/rose-auto-rca-tool timeline-start

      - name: Verify unchanged reproduction after retry
        id: repro_retry
        if: always() && steps.checkpoint_retry.outcome == 'success' && steps.validate_retry.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: /usr/local/bin/rose-auto-rca-tool verify-repro

      - name: Timeline — finish retry reproduction
        if: always() && steps.timeline_retry_reproduction_start.outcome == 'success'
        shell: bash
        env:
          RCA_TIMELINE_STEP: rca-retry-reproduction
          RCA_TIMELINE_STATUS: ${{ steps.repro_retry.outcome == 'success' && 'passed' || 'failed' }}
        run: /usr/local/bin/rose-auto-rca-tool timeline-finish

      - name: Timeline — start retry offline deploy gates
        id: timeline_retry_offline_start
        if: steps.repro_retry.outcome == 'success'
        shell: bash
        env:
          RCA_TIMELINE_STEP: deploy-retry-offline
        run: /usr/local/bin/rose-auto-rca-tool timeline-start

      - name: Run offline gate after retry
        id: offline_retry
        if: steps.repro_retry.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
          BACKEND_CODEX_TOKEN_SYNC_SKIP: "1"
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          NODE_ENV: test
          SUPABASE_JWT_SECRET: auto-rca-local-jwt-secret-32-bytes
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_BACKEND_API_URL: http://127.0.0.1:3001
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: /usr/local/bin/rose-auto-rca-tool offline-gates

      - name: Timeline — finish retry offline deploy gates
        if: always() && steps.timeline_retry_offline_start.outcome == 'success'
        shell: bash
        env:
          RCA_TIMELINE_STEP: deploy-retry-offline
          RCA_TIMELINE_STATUS: ${{ steps.offline_retry.outcome == 'success' && 'passed' || 'failed' }}
        run: /usr/local/bin/rose-auto-rca-tool timeline-finish

      - name: Timeline — start retry smoke deploy gates
        id: timeline_retry_smoke_start
        if: steps.offline_retry.outcome == 'success'
        shell: bash
        env:
          RCA_TIMELINE_STEP: deploy-retry-smoke
        run: /usr/local/bin/rose-auto-rca-tool timeline-start

      - name: Run smoke gate after retry
        id: smoke_retry
        if: steps.offline_retry.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: /usr/local/bin/rose-auto-rca-tool smoke-gates

      - name: Timeline — finish retry smoke deploy gates
        if: always() && steps.timeline_retry_smoke_start.outcome == 'success'
        shell: bash
        env:
          RCA_TIMELINE_STEP: deploy-retry-smoke
          RCA_TIMELINE_STATUS: ${{ steps.smoke_retry.outcome == 'success' && 'passed' || 'failed' }}
        run: /usr/local/bin/rose-auto-rca-tool timeline-finish

      - name: Timeline — start trusted PR finalization
        id: timeline_finalize_start
        if: always() && env.RCA_NOOP != 'true'
        shell: bash
        env:
          RCA_TIMELINE_STEP: deploy-finalize
        run: /usr/local/bin/rose-auto-rca-tool timeline-start

      - name: Finalize PR from trusted completion contract
        id: finalize
        if: always() && env.RCA_NOOP != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_UPDATE_TOKEN }}
          AUTO_RCA_PR_TOKEN: ${{ secrets.GH_UPDATE_TOKEN }}
          PRIMARY_INVESTIGATOR_OUTCOME: ${{ steps.validate_primary.outcome }}
          RETRY_INVESTIGATOR_OUTCOME: ${{ steps.validate_retry.outcome }}
        run: /usr/local/bin/rose-auto-rca-tool ensure-draft

      - name: Timeline — finish trusted PR finalization
        id: timeline_finalize_finish
        if: always() && steps.timeline_finalize_start.outcome == 'success'
        shell: bash
        env:
          RCA_TIMELINE_STEP: deploy-finalize
          RCA_TIMELINE_STATUS: ${{ steps.finalize.outcome == 'success' && 'passed' || 'failed' }}
        run: /usr/local/bin/rose-auto-rca-tool timeline-finish

      - name: Persist the final trusted waterfall on the PR
        if: always() && steps.finalize.outcome == 'success' && steps.timeline_finalize_finish.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_UPDATE_TOKEN }}
          AUTO_RCA_PR_TOKEN: ${{ secrets.GH_UPDATE_TOKEN }}
        run: /usr/local/bin/rose-auto-rca-tool sync-waterfall

      - name: Slack — reflect trusted final state
        id: slack_final
        if: always() && env.RCA_NOOP != 'true' && steps.begin.outputs.pr_url != '' && env.SLACK_CHANNEL != ''
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          RCA_STATE: ${{ steps.finalize.outputs.state || 'blocked' }}
          RCA_FE_URL: https://roselabs.ai/?agent-id=${{ env.AGENT_ID }}
          RCA_PR_URL: ${{ steps.finalize.outputs.pr_url || steps.begin.outputs.pr_url }}
          RCA_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: /usr/local/bin/rose-auto-rca-tool slack-update

      - name: Slack — answer reviewer feedback in the lifecycle thread
        id: slack_feedback_reply
        if: >-
          always() && env.RCA_MODE == 'revision' && env.RCA_NOOP != 'true' &&
          env.RCA_FEEDBACK_COMMENT_IDS != '' && env.SLACK_CHANNEL != '' &&
          steps.finalize.outcome == 'success' && steps.slack_final.outcome == 'success'
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          RCA_STATE: ${{ steps.finalize.outputs.state || 'blocked' }}
          RCA_FE_URL: https://roselabs.ai/?agent-id=${{ env.AGENT_ID }}
          RCA_PR_URL: ${{ steps.finalize.outputs.pr_url || steps.begin.outputs.pr_url }}
          RCA_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: /usr/local/bin/rose-auto-rca-tool slack-reply

      - name: Mark the durable feedback batch consumed
        if: >-
          always() && env.RCA_MODE == 'revision' && env.RCA_NOOP != 'true' &&
          env.RCA_FEEDBACK_COMMENT_IDS != '' && steps.finalize.outcome == 'success' &&
          (env.SLACK_CHANNEL == '' || steps.slack_feedback_reply.outcome == 'success')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_UPDATE_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$RCA_PR_NUMBER" =~ ^[0-9]+$ ]] || { echo 'Invalid RCA PR number' >&2; exit 1; }
          [[ "$RCA_FEEDBACK_COMMENT_IDS" =~ ^[0-9]+(,[0-9]+)*$ ]] || {
            echo 'Invalid consumed feedback IDs' >&2; exit 1;
          }
          marker="<!-- rca-feedback-consumed ids=$RCA_FEEDBACK_COMMENT_IDS run=$GITHUB_RUN_ID -->"
          gh api "repos/$GITHUB_REPOSITORY/issues/$RCA_PR_NUMBER/comments" \
            --method POST --raw-field "body=$marker" >/dev/null

      - name: Require complete evidence-backed RCA
        if: always() && env.RCA_NOOP != 'true'
        shell: bash
        run: /usr/local/bin/rose-auto-rca-tool require-complete
