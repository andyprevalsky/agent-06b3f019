name: Auto RCA

# Launches the Claude Code harness to root-cause a production agent failure and
# open a DRAFT PR with a real repro + fix + cemented test.
#
# WHERE THE HARNESS RUNS vs WHERE THE REPRO RUNS
# ----------------------------------------------
# The coding harness (Claude running /rca — read code, edit, open PR) runs HERE,
# on a GitHub-hosted runner via `anthropics/claude-code-action@v1` — the same
# harness `claude-code-review-fallback.yml` uses. We do NOT rebuild an agent.
#
# The full-resource REPRODUCTION is a backend the harness *calls*, not a place it
# lives. When /rca needs to reproduce a live agent failure it runs
# `scripts/run-bench <task>`, which clones a credentialed warm Fly box (Temporal
# Cloud + LLM/compute creds + `run.sh` full stack), runs the repro, and tears
# down. The runner just needs FLY_API_TOKEN to drive it — the creds live on the
# Fly image, not here. So the harness can reproduce ANY failure at full fidelity
# without us re-hosting the stack in CI.
#
# Inert until AUTO_RCA_ENABLED=1 turns on the dispatch in errorAlert.ts /
# error_alert.py — safe to merge dormant.

on:
  repository_dispatch:
    types: [agent-failure]
  workflow_dispatch:
    inputs:
      agent_id:
        description: Failing agent ID to RCA
        required: true
        type: string

concurrency:
  # One RCA run per agent — a re-dispatch supersedes an in-flight run for the
  # same agent, and distinct agents never contend.
  group: auto-rca-${{ github.event.client_payload.agent_id || inputs.agent_id }}
  cancel-in-progress: true

jobs:
  rca:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    env:
      AGENT_ID: ${{ github.event.client_payload.agent_id || inputs.agent_id }}
      # Never promote repository_dispatch free text into the privileged prompt.
      # These trusted values are generated from the validated UUID below.
      FAILURE_SOURCE: agent_workflow
      FAILURE_TITLE: Production agent failure
      GH_TOKEN: ${{ github.token }}
      # Prod evidence.
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      CLICKHOUSE_ENDPOINT: ${{ secrets.CLICKHOUSE_ENDPOINT }}
      CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
      CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
      # Drives the fleet for full-resource repro (`scripts/run-bench`).
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      PROD_BACKEND_URL: https://navi-j9a9.onrender.com
      # Slack lifecycle card — the emitter posts the initial message and passes
      # its handle here so we edit that SAME message through the lifecycle.
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_ERROR_CHANNEL_ID: ${{ secrets.SLACK_ERROR_CHANNEL_ID }}
      DISPATCH_SLACK_TS: ${{ github.event.client_payload.slack_ts }}
      DISPATCH_SLACK_CHANNEL: ${{ github.event.client_payload.slack_channel }}

    steps:
      - name: Validate dispatch payload
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "${AGENT_ID:-}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]; then
            echo "agent_id must be a UUID — refusing untrusted dispatch payload." >&2
            exit 1
          fi
          if [ -n "${DISPATCH_SLACK_TS:-}" ] && ! [[ "$DISPATCH_SLACK_TS" =~ ^[0-9]{10,}\.[0-9]{6}$ ]]; then
            echo "slack_ts must be a Slack message timestamp." >&2
            exit 1
          fi
          if [ -n "${DISPATCH_SLACK_CHANNEL:-}" ] && ! [[ "$DISPATCH_SLACK_CHANNEL" =~ ^[A-Z0-9]{9,32}$ ]]; then
            echo "slack_channel must be a Slack channel ID." >&2
            exit 1
          fi
          printf 'FAILURE_TITLE=Production agent failure %s\n' "$AGENT_ID" >> "$GITHUB_ENV"
          printf 'SLACK_TS=%s\n' "${DISPATCH_SLACK_TS:-}" >> "$GITHUB_ENV"
          printf 'SLACK_CHANNEL=%s\n' "${DISPATCH_SLACK_CHANNEL:-}" >> "$GITHUB_ENV"

      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install flyctl (for full-resource repro via scripts/run-bench)
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master

      - name: Install evidence tooling
        continue-on-error: true
        run: pip install httpx

      - name: Create RCA branch
        shell: bash
        run: |
          set -euo pipefail
          short_id="$(echo "$AGENT_ID" | tr -cd 'a-zA-Z0-9' | cut -c1-12)"
          branch="auto-rca/${short_id}-${GITHUB_RUN_ID}"
          git config user.name "rose-auto-rca[bot]"
          git config user.email "auto-rca@roselabs.ai"
          git checkout -b "$branch"
          echo "RCA_BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Slack — mark RCA running
        id: slack
        if: env.SLACK_BOT_TOKEN != ''
        shell: bash
        run: |
          set -uo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          channel="${SLACK_CHANNEL:-$SLACK_ERROR_CHANNEL_ID}"
          text="🟡 *RCA running* — \`${AGENT_ID}\` (${FAILURE_SOURCE})"$'\n'"${FAILURE_TITLE}"$'\n'"<${run_url}|▶ View the RCA run>"
          if [ -n "${SLACK_TS:-}" ]; then
            # The emitter already posted the card — edit it in place.
            curl -sS -X POST https://slack.com/api/chat.update \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" -H 'Content-Type: application/json; charset=utf-8' \
              --data "$(jq -n --arg c "$channel" --arg ts "$SLACK_TS" --arg t "$text" '{channel:$c,ts:$ts,text:$t}')" >/dev/null || true
            ts="$SLACK_TS"
          elif [ -n "$channel" ]; then
            # Manual workflow_dispatch: no prior card — post a fresh one, keep its ts.
            resp="$(curl -sS -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" -H 'Content-Type: application/json; charset=utf-8' \
              --data "$(jq -n --arg c "$channel" --arg t "$text" '{channel:$c,text:$t}')" || true)"
            ts="$(printf '%s' "$resp" | jq -r '.ts // empty')"
          else
            ts=""
          fi
          if [ -n "${ts:-}" ] && ! [[ "$ts" =~ ^[0-9]{10,}\.[0-9]{6}$ ]]; then
            echo "Slack returned an invalid message timestamp; lifecycle updates disabled." >&2
            ts=""
          fi
          if [ -n "${channel:-}" ] && ! [[ "$channel" =~ ^[A-Z0-9]{9,32}$ ]]; then
            echo "Slack returned an invalid channel ID; lifecycle updates disabled." >&2
            channel=""
            ts=""
          fi
          printf 'ts=%s\n' "${ts:-}" >> "$GITHUB_OUTPUT"
          printf 'channel=%s\n' "${channel:-}" >> "$GITHUB_OUTPUT"
          printf 'SLACK_TS=%s\n' "${ts:-}" >> "$GITHUB_ENV"
          printf 'SLACK_CHANNEL=%s\n' "${channel:-}" >> "$GITHUB_ENV"

      - name: Root-cause with Claude Code
        uses: anthropics/claude-code-action@b76a0776ae74036e77cd11018083743453d7ad35 # v1
        with:
          # Dedicated Claude Max subscription for RCA — isolated compute, so its
          # Opus runs don't contend with the review bot or human devs. Minted via
          # `claude setup-token` on the rca@roselabs.ai account.
          claude_code_oauth_token: ${{ secrets.RCA_CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Run /rca on the production agent that just failed. Read
            docs/root-cause-analysis.md first and follow it exactly — the hard
            gate is a LOCAL REPRO you ran and watched FAIL, then a FIX that makes
            that same repro PASS, then CEMENT it into the suite /deploy runs.

            Agent ID: ${{ env.AGENT_ID }}

            EVIDENCE FIRST:
              scripts/auto-rca-tool evidence
            Identify the first-bad boundary.

            REPRODUCE AT FULL FIDELITY: you have full resources — FLY_API_TOKEN is
            set, so `scripts/run-bench <task>` clones a credentialed warm Fly box
            (Temporal Cloud + LLM/compute + the full `run.sh` stack) to run a real
            agent repro. Use it for agent-level failures: author or select the
            benchmark task that reproduces THIS failure, run it, and confirm it
            fails the same way. Write the selected catalog task name to
            `.context/auto-rca/benchmark-task`, then run
            `scripts/auto-rca-tool benchmark`. For API/provider-level bugs a backend blackbox
            under back-end/src/tests/blackbox/ is the faster repro. Whichever you
            use: it MUST fail before the fix and pass after, with no weakened
            assertion, and be cemented so the regression can't return.

            OPEN THE PR: write the PR body to `.context/auto-rca/pr-body.md`, then
            run `scripts/auto-rca-tool publish-draft`. The broker commits tracked
            changes, pushes only $RCA_BRANCH, opens a DRAFT PR into main titled
            "auto-RCA: ${{ env.FAILURE_TITLE }}", and appends the trusted Slack
            lifecycle marker. In the body: link the failing
            agent (https://roselabs.ai/?agent-id=${{ env.AGENT_ID }}), give the
            root cause, the repro (command + pre/post output), and the fix.

            THEN RUN THE DEPLOY GATES (do not skip): run the /deploy Phase 1 gate
            suite on your committed draft branch with
            `scripts/auto-rca-tool offline-gates`, then run the fleet smoke gate
            with `scripts/auto-rca-tool smoke-gates`. Fix anything that fails,
            republish the draft, and re-run both until every gate is green. When
            ALL gates pass for the current HEAD, run
            `scripts/auto-rca-tool mark-ready`. Do NOT merge — a human
            reviews the ready PR and merges; that human merge is the ONLY hard gate.

            If a repro is genuinely impossible, open the DRAFT PR (leave it draft)
            with the evidence, the first-bad boundary, a scaffolded repro, and the
            proposed fix — labeled "preliminary + observability gap", never a bare
            theory. Only leave a PR as draft when a gate is genuinely unfixable
            here; say exactly which gate and why in the body.
          claude_args: |
            --model opus
            --effort high
            --max-turns 80
            --allowedTools "Bash(scripts/auto-rca-tool evidence),Bash(scripts/auto-rca-tool benchmark),Bash(scripts/auto-rca-tool offline-gates),Bash(scripts/auto-rca-tool smoke-gates),Bash(scripts/auto-rca-tool publish-draft),Bash(scripts/auto-rca-tool mark-ready)"

      - name: Require RCA pull request
        shell: bash
        run: |
          set -euo pipefail
          pr_url="$(gh pr list --head "$RCA_BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -z "$pr_url" ]; then
            echo "No RCA pull request was created — failing the workflow." >&2
            exit 1
          fi
          echo "RCA pull request: $pr_url"

      - name: Slack — reflect PR outcome
        if: always() && env.SLACK_BOT_TOKEN != '' && steps.slack.outputs.ts != ''
        shell: bash
        env:
          SLACK_OUTPUT_TS: ${{ steps.slack.outputs.ts }}
        run: |
          set -uo pipefail
          channel="${SLACK_CHANNEL:-$SLACK_ERROR_CHANNEL_ID}"
          ts="$SLACK_OUTPUT_TS"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          pr_url="$(gh pr list --head "$RCA_BRANCH" --state open --json url --jq '.[0].url // empty' 2>/dev/null || true)"
          is_draft="$(gh pr list --head "$RCA_BRANCH" --state open --json isDraft --jq '.[0].isDraft // empty' 2>/dev/null || true)"
          if [ -n "$pr_url" ] && [ "$is_draft" = "false" ]; then
            text="🟢 *Ready for review — approve to ship* · \`${AGENT_ID}\`"$'\n'"All deploy gates green."$'\n'"<${pr_url}|Open PR> · <${run_url}|RCA run>"
          elif [ -n "$pr_url" ]; then
            text="🔵 *Draft PR open* (needs attention) · \`${AGENT_ID}\`"$'\n'"<${pr_url}|Open PR> · <${run_url}|RCA run>"
          else
            text="⚠️ *RCA finished without a PR* · \`${AGENT_ID}\`"$'\n'"<${run_url}|RCA run>"
          fi
          curl -sS -X POST https://slack.com/api/chat.update \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" -H 'Content-Type: application/json; charset=utf-8' \
            --data "$(jq -n --arg c "$channel" --arg ts "$ts" --arg t "$text" '{channel:$c,ts:$ts,text:$t}')" >/dev/null || true
