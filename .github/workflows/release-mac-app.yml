name: Release Mac App

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v1.0.0, v1.2.3

jobs:
  build-and-release:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies (shared UI)
        working-directory: front-end
        run: npm install --ignore-scripts

      - name: Install dependencies (skip native compilation)
        working-directory: mac-app
        run: npm install --ignore-scripts

      - name: Generate production env file
        working-directory: mac-app
        run: |
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ] || [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY secrets are required."
            exit 1
          fi
          cat <<EOF > .env.production
VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_API_URL }}
VITE_BACKEND_API_URL=${{ secrets.VITE_BACKEND_API_URL }}
ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
NODE_ENV=production
EOF

      - name: Build Electron app (rebuilds native modules)
        working-directory: mac-app
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # Add any env vars your app needs for building
          # VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          # VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            mac-app/dist/Rose-mac.dmg
            mac-app/dist/Rose-mac.zip
            mac-app/dist/Rose-mac.dmg.blockmap
            mac-app/dist/Rose-mac.zip.blockmap
            mac-app/dist/latest-mac.yml
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

