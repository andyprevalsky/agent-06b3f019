name: Release Mac App

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v1.0.0, v1.2.3

permissions:
  contents: write # softprops/action-gh-release creates the GitHub Release entry

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.10.0'

      # ============================================
      # CERTIFICATE AND CREDENTIAL SETUP
      # ============================================

      - name: Install Apple certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create a temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Decode and import certificate
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Allow codesign to access the keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add keychain to search list (prepend to existing)
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Verify certificate was imported
          echo "Verifying certificate import..."
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Setup notarytool credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Store credentials for notarytool in keychain
          xcrun notarytool store-credentials "rose-notarize" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

          echo "Notarytool credentials stored successfully"

      # ============================================
      # BUILD STEPS
      # ============================================

      - name: Sync package.json version with tag
        working-directory: mac-app
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Setting package.json version to $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install frontend dependencies (shared UI)
        working-directory: front-end
        run: npm install --ignore-scripts

      - name: Install dependencies
        working-directory: mac-app
        run: npm install

      - name: Generate production env file
        working-directory: mac-app
        run: |
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ] || [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY secrets are required."
            exit 1
          fi
          cat <<'EOF' | sed 's/^ *//' > .env.production
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_BACKEND_API_URL=${{ secrets.VITE_BACKEND_API_URL }}
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
            GH_UPDATE_TOKEN=${{ secrets.GH_UPDATE_TOKEN }}
            NODE_ENV=production
          EOF

      - name: Build and sign Electron app
        working-directory: mac-app
        run: |
          npm run build:vite
          # Build without notarization (we'll do it separately)
          SKIP_NOTARIZATION=true npx electron-builder --publish=never
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify code signing
        working-directory: mac-app
        run: |
          echo "Verifying .app signature..."
          codesign --verify --deep --strict --verbose=2 dist/mac-arm64/Rose.app
          echo "Verifying DMG signature..."
          codesign --verify --verbose=2 dist/Rose-mac.dmg || true

      # ============================================
      # BACKUP SIGNED DMG (before notarization)
      # Stored as artifact in case notarization times out
      # Download from Actions run page if needed
      # ============================================

      - name: Upload signed DMG as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: signed-dmg-backup
          path: |
            mac-app/dist/Rose-mac.dmg
            mac-app/dist/Rose-mac.zip
          retention-days: 30

      # ============================================
      # NOTARIZATION (may take a while)
      # ============================================

      - name: Submit DMG for notarization
        id: notarize
        working-directory: mac-app
        run: |
          echo "Submitting DMG for notarization..."
          RESULT=$(xcrun notarytool submit dist/Rose-mac.dmg \
            --keychain-profile "rose-notarize" \
            --output-format json)

          SUBMISSION_ID=$(echo "$RESULT" | jq -r '.id')
          if [[ -z "$SUBMISSION_ID" || "$SUBMISSION_ID" == "null" ]]; then
            echo "Failed to extract submission ID from notarytool response:"
            echo "$RESULT"
            exit 1
          fi
          echo "Submission ID: $SUBMISSION_ID"
          echo "submission_id=$SUBMISSION_ID" >> $GITHUB_OUTPUT

      - name: Wait for notarization (timeout 45min)
        working-directory: mac-app
        run: |
          echo "Waiting for notarization to complete..."
          echo "Submission ID: ${{ steps.notarize.outputs.submission_id }}"
          echo ""
          echo "If this times out, run locally:"
          echo "  ./mac-app/scripts/finish-release.sh ${{ steps.notarize.outputs.submission_id }}"
          echo ""

          xcrun notarytool wait ${{ steps.notarize.outputs.submission_id }} \
            --keychain-profile "rose-notarize" \
            --timeout 45m

          # Check result
          xcrun notarytool info ${{ steps.notarize.outputs.submission_id }} \
            --keychain-profile "rose-notarize"

      - name: Staple notarization ticket
        working-directory: mac-app
        run: |
          echo "Stapling ticket to DMG..."
          xcrun stapler staple dist/Rose-mac.dmg
          xcrun stapler validate dist/Rose-mac.dmg

      # ============================================
      # UPLOAD DMG TO SUPABASE STORAGE (public downloads)
      # ============================================

      - name: Rewrite latest-mac.yml URLs to Supabase
        working-directory: mac-app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          # Rewrite download URLs in latest-mac.yml to point at Supabase public bucket
          PUBLIC_BASE="${SUPABASE_URL}/storage/v1/object/public/Releases/mac/latest"
          sed -i '' "s|url:.*Rose-mac.dmg|url: ${PUBLIC_BASE}/Rose-mac.dmg|" dist/latest-mac.yml
          sed -i '' "s|url:.*Rose-mac.zip|url: ${PUBLIC_BASE}/Rose-mac.zip|" dist/latest-mac.yml
          echo "Rewritten latest-mac.yml:"
          cat dist/latest-mac.yml

      - name: Upload release artifacts to Supabase Storage
        working-directory: mac-app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          upload_file() {
            local FILE="$1"
            local DEST="$2"
            local CONTENT_TYPE="${3:-application/octet-stream}"
            echo "Uploading $FILE -> $DEST"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              "${SUPABASE_URL}/storage/v1/object/${DEST}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: ${CONTENT_TYPE}" \
              -H "x-upsert: true" \
              --data-binary @"$FILE")
            if [[ "$STATUS" -ne 200 ]]; then
              echo "  WARNING: HTTP $STATUS"
              return 1
            fi
            echo "  OK"
          }

          # Upload to versioned path (archive)
          upload_file "dist/Rose-mac.dmg" "Releases/mac/v${VERSION}/Rose-mac.dmg"

          # Upload to latest path (auto-updater + public download)
          upload_file "dist/Rose-mac.dmg" "Releases/mac/latest/Rose-mac.dmg" || exit 1
          upload_file "dist/Rose-mac.zip" "Releases/mac/latest/Rose-mac.zip" || exit 1
          upload_file "dist/Rose-mac.dmg.blockmap" "Releases/mac/latest/Rose-mac.dmg.blockmap" || true
          upload_file "dist/Rose-mac.zip.blockmap" "Releases/mac/latest/Rose-mac.zip.blockmap" || true
          upload_file "dist/latest-mac.yml" "Releases/mac/latest/latest-mac.yml" "text/yaml" || exit 1

          echo ""
          echo "Public URLs:"
          echo "  DMG: ${SUPABASE_URL}/storage/v1/object/public/Releases/mac/latest/Rose-mac.dmg"
          echo "  YML: ${SUPABASE_URL}/storage/v1/object/public/Releases/mac/latest/latest-mac.yml"

      - name: Upload stapled DMG to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            mac-app/dist/Rose-mac.dmg
            mac-app/dist/Rose-mac.zip
            mac-app/dist/Rose-mac.dmg.blockmap
            mac-app/dist/Rose-mac.zip.blockmap
            mac-app/dist/latest-mac.yml
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================
      # CLEANUP
      # ============================================

      - name: Cleanup keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
