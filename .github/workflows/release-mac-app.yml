name: Release Mac App

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v1.0.0, v1.2.3

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.10.0'

      # ============================================
      # CERTIFICATE AND CREDENTIAL SETUP
      # ============================================

      - name: Install Apple certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create a temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Decode and import certificate
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Allow codesign to access the keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add keychain to search list (prepend to existing)
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Verify certificate was imported
          echo "Verifying certificate import..."
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Setup notarytool credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Store credentials for notarytool in keychain
          xcrun notarytool store-credentials "rose-notarize" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

          echo "Notarytool credentials stored successfully"

      # ============================================
      # BUILD STEPS
      # ============================================

      - name: Install frontend dependencies (shared UI)
        working-directory: front-end
        run: npm install --ignore-scripts

      - name: Install dependencies
        working-directory: mac-app
        run: npm install

      - name: Generate production env file
        working-directory: mac-app
        run: |
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ] || [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY secrets are required."
            exit 1
          fi
          cat <<'EOF' | sed 's/^ *//' > .env.production
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_BACKEND_API_URL=${{ secrets.VITE_BACKEND_API_URL }}
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
            GH_UPDATE_TOKEN=${{ secrets.GH_UPDATE_TOKEN }}
            NODE_ENV=production
          EOF

      - name: Build, sign, and notarize Electron app
        working-directory: mac-app
        run: |
          npm run build:vite
          npx electron-builder --publish=never
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder will find the signing identity from keychain

      # ============================================
      # VERIFICATION
      # ============================================

      - name: Verify code signing and notarization
        working-directory: mac-app
        run: |
          chmod +x scripts/verify-signing.sh
          ./scripts/verify-signing.sh

      # ============================================
      # RELEASE
      # ============================================

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            mac-app/dist/Rose-mac.dmg
            mac-app/dist/Rose-mac.zip
            mac-app/dist/Rose-mac.dmg.blockmap
            mac-app/dist/Rose-mac.zip.blockmap
            mac-app/dist/latest-mac.yml
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================
      # CLEANUP
      # ============================================

      - name: Cleanup keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
