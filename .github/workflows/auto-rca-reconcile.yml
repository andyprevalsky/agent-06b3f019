name: Auto RCA — reconcile lifecycle

on:
  workflow_run:
    workflows: [Auto RCA]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: auto-rca-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted lifecycle code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Install trusted lifecycle broker
        run: sudo install -o root -g root -m 0555 scripts/auto-rca-tool /usr/local/bin/rose-auto-rca-tool

      - name: Reconcile every open Auto RCA lifecycle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_UPDATE_TOKEN }}
          AUTO_RCA_PR_TOKEN: ${{ secrets.GH_UPDATE_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
          DEFAULT_SLACK_CHANNEL: ${{ secrets.SLACK_ERROR_CHANNEL_ID }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          AUTO_RCA_ROOT_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          uuid_re='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          trigger_agent_id=''
          trigger_is_feedback=false
          if [[ "${TRIGGER_RUN_ID:-}" =~ ^[0-9]+$ ]]; then
            if [[ "${TRIGGER_RUN_TITLE:-}" == 'Auto RCA · '* ]]; then
              trigger_agent_id="${TRIGGER_RUN_TITLE#Auto RCA · }"
              if [[ "$trigger_agent_id" == 'auto-RCA: Production agent failure '* ]]; then
                trigger_agent_id="${trigger_agent_id#auto-RCA: Production agent failure }"
                trigger_is_feedback=true
              fi
            fi
            if [[ "$trigger_agent_id" =~ $uuid_re ]]; then
              search="\"auto-RCA: Production agent failure $trigger_agent_id\" in:title"
            else
              search="actions/runs/$TRIGGER_RUN_ID in:body"
            fi
          else
            search='auto-RCA: Production agent failure in:title'
          fi
          if [[ "$trigger_agent_id" =~ $uuid_re ]]; then
            # workflow_run recovery cannot depend on GitHub's eventually
            # consistent title index: a false zero here would fork the agent
            # into a second PR. Read the authoritative open-PR collection.
            open_pr_pages="$(gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100")"
            prs="$(printf '%s' "$open_pr_pages" | AGENT_ID="$trigger_agent_id" \
              /usr/local/bin/rose-auto-rca-tool select-agent-prs)"
          else
            prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
              --search "$search" --json number,title,url,body,headRefName,isDraft)"
          fi
          count="$(printf '%s' "$prs" | jq 'length')"
          if [ "$count" -eq 0 ] && [[ "$trigger_agent_id" =~ $uuid_re ]] \
            && [[ "${TRIGGER_RUN_ID:-}" =~ ^[0-9]+$ ]]; then
            # Even a checkout/setup/PR-creation failure must converge to a
            # visible blocked draft with all three Slack links. A run-scoped
            # legacy branch avoids overwriting a partially-pushed primary.
            short_id="$(printf '%s' "$trigger_agent_id" | tr -cd 'a-zA-Z0-9' | cut -c1-12)"
            recovery_branch="auto-rca/${short_id}-${TRIGGER_RUN_ID}"
            git config user.name "rose-auto-rca[bot]"
            git config user.email "auto-rca@roselabs.ai"
            git checkout -B "$recovery_branch" main
            recovery_pr_url="$(AGENT_ID="$trigger_agent_id" RCA_BRANCH="$recovery_branch" \
              GITHUB_RUN_ID="$TRIGGER_RUN_ID" SLACK_TS='' SLACK_CHANNEL="$DEFAULT_SLACK_CHANNEL" \
              RCA_BEGIN_REASON="The RCA workflow ended before it could create its draft. Recovery created this blocked PR; reply in its Slack thread or leave a normal top-level PR comment to retry." \
              /usr/local/bin/rose-auto-rca-tool begin-draft | tail -1)"
            [[ "$recovery_pr_url" =~ ^https://github\.com/[^/]+/[^/]+/pull/[0-9]+$ ]] || {
              echo "Recovery did not create a valid PR URL" >&2; exit 1;
            }
            recovery_pr_number="${recovery_pr_url##*/}"
            prs="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$recovery_pr_number" --jq \
              '[{number, title, url: .html_url, body, headRefName: .head.ref, isDraft: .draft}]')"
            count=1
          fi
          for ((index = 0; index < count; index += 1)); do
            pr="$(printf '%s' "$prs" | jq -c ".[$index]")"
            title="$(printf '%s' "$pr" | jq -r '.title')"
            agent_id="${title#auto-RCA: Production agent failure }"
            [[ "$agent_id" =~ $uuid_re ]] || continue
            [ "$title" = "auto-RCA: Production agent failure $agent_id" ] || continue
            [ -z "$trigger_agent_id" ] || [ "$trigger_agent_id" = "$agent_id" ] || continue
            branch="$(printf '%s' "$pr" | jq -r '.headRefName')"
            short_id="$(printf '%s' "$agent_id" | tr -cd 'a-zA-Z0-9' | cut -c1-12)"
            if [ "$branch" != "auto-rca/$agent_id" ] && ! [[ "$branch" =~ ^auto-rca/${short_id}-[0-9]+$ ]]; then
              continue
            fi
            body="$(printf '%s' "$pr" | jq -r '.body // ""')"
            marker="$(printf '%s' "$body" | grep -oE '<!-- rca-slack ts=[^ ]* channel=[^ ]*( agent=[^ ]+ run=[^ ]+)? -->' | head -1 || true)"
            slack_ts="$(printf '%s' "$marker" | sed -nE 's/.*ts=([^ ]*).*/\1/p')"
            slack_channel="$(printf '%s' "$marker" | sed -nE 's/.*channel=([^ ]*).*/\1/p')"
            marker_run_id="$(printf '%s' "$marker" | sed -nE 's/.* run=([^ ]+) -->/\1/p')"
            if [ "$trigger_agent_id" = "$agent_id" ] && [ "$trigger_is_feedback" = true ] \
              && [[ "${TRIGGER_RUN_ID:-}" =~ ^[0-9]+$ ]]; then
              run_id="$TRIGGER_RUN_ID"
            elif [[ "$marker_run_id" =~ ^[0-9]+$ ]]; then
              # A repository/workflow dispatch against an already-verified PR
              # is a reducer no-op. Preserve the useful original RCA run.
              run_id="$marker_run_id"
            elif [ "$trigger_agent_id" = "$agent_id" ] && [[ "${TRIGGER_RUN_ID:-}" =~ ^[0-9]+$ ]]; then
              run_id="$TRIGGER_RUN_ID"
            else
              run_id=''
            fi
            [ -n "$slack_channel" ] || slack_channel="$DEFAULT_SLACK_CHANNEL"
            [[ "$slack_channel" =~ ^[A-Z0-9]{9,32}$ ]] || continue
            [[ "$run_id" =~ ^[0-9]+$ ]] || continue
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" 2>/dev/null || printf '{}')"
            run_status="$(printf '%s' "$run" | jq -r '.status // "completed"')"
            verified="$(printf '%s' "$body" | sed -nE 's/.*<!-- rca-verified head=[0-9a-f]{40} agent=([^ ]+) run=([0-9]+) -->.*/\1 \2/p' | head -1)"
            read -r verified_agent verified_run <<< "$verified"
            pr_is_draft="$(printf '%s' "$pr" | jq -r '.isDraft')"
            read -r state repair < <(RCA_RUN_STATUS="$run_status" RCA_PR_IS_DRAFT="$pr_is_draft" \
              RCA_VERIFIED_AGENT="$verified_agent" RCA_VERIFIED_RUN="$verified_run" \
              AGENT_ID="$agent_id" GITHUB_RUN_ID="$run_id" \
              /usr/local/bin/rose-auto-rca-tool reconcile-plan)
            pipeline_step_override=''
            if [ "$state" = blocked ] && { \
              ! grep -Fq '<!-- rca-waterfall-start -->' <<< "$body" || \
              grep -Fq '— in progress' <<< "$body"; \
            }; then
              jobs="$(gh api --paginate --slurp \
                "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" 2>/dev/null || printf '[]')"
              failed_step="$(printf '%s' "$jobs" | jq -r \
                '[.[][]?.steps[]? | select(.conclusion == "failure" or .conclusion == "cancelled")][0].name // ""')"
              case "$failed_step" in
                *production\ evidence*) pipeline_step_override='/RCA · production evidence — failed' ;;
                *reproduction*) pipeline_step_override='/RCA · unchanged local reproduction — failed' ;;
                *investigation*|*coding\ environment*|*ownership*) pipeline_step_override='/RCA · investigation — failed' ;;
                *offline*) pipeline_step_override='/deploy · offline gates — failed' ;;
                *smoke*) pipeline_step_override='/deploy · smoke gates — failed' ;;
                *finalization*|*Finalize\ PR*) pipeline_step_override='/deploy · trusted PR finalization — failed' ;;
                *Require\ complete*) pipeline_step_override='/deploy · completion contract — failed' ;;
                *) pipeline_step_override='/RCA · workflow setup — failed' ;;
              esac
            fi
            if [ "$repair" = draft ]; then
              gh pr ready --undo --repo "$GITHUB_REPOSITORY" "$(printf '%s' "$pr" | jq -r '.url')"
            fi
            response="$(curl -fsS --retry 3 --retry-all-errors --connect-timeout 5 --max-time 20 \
              "https://navi-j9a9.onrender.com/api/agents/$agent_id/alert-context" \
              -H "X-API-Key: $BACKEND_API_KEY" 2>/dev/null || true)"
            affected_user_name="$(printf '%s' "$response" | jq -r '.affected_user_name // empty' 2>/dev/null || true)"
            affected_user_name="$(printf '%s' "$affected_user_name" | tr '\r\n\t' '   ' | tr -s ' ' \
              | sed 's/^ *//; s/ *$//; s/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' | cut -c1-160)"
            [ -n "$affected_user_name" ] || affected_user_name='Affected user unavailable'
            output="$(mktemp "${RUNNER_TEMP:-/tmp}/auto-rca-reconcile.XXXXXX")"
            GITHUB_OUTPUT="$output" GITHUB_ENV='' \
            AGENT_ID="$agent_id" AFFECTED_USER_NAME="$affected_user_name" RCA_STATE="$state" \
            RCA_FE_URL="https://roselabs.ai/?agent-id=$agent_id" \
            RCA_PR_URL="$(printf '%s' "$pr" | jq -r '.url')" \
            RCA_PR_BODY="$body" \
            RCA_RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id" \
            RCA_PIPELINE_STEP_OVERRIDE="$pipeline_step_override" \
            RCA_RECONCILE_SLACK=true SLACK_TS="$slack_ts" SLACK_CHANNEL="$slack_channel" \
              /usr/local/bin/rose-auto-rca-tool slack-update
            resolved_ts="$(sed -n 's/^ts=//p' "$output" | tail -1)"
            rm -f "$output"
            SLACK_TS="$resolved_ts" SLACK_CHANNEL="$slack_channel" AGENT_ID="$agent_id" \
            RCA_BRANCH="$branch" GITHUB_RUN_ID="$run_id" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
              /usr/local/bin/rose-auto-rca-tool bind-slack
          done
