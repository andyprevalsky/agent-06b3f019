name: Auto RCA — reconcile lifecycle

on:
  workflow_run:
    workflows: [Auto RCA]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: auto-rca-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Checkout trusted lifecycle code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Install trusted lifecycle broker
        run: sudo install -o root -g root -m 0555 scripts/auto-rca-tool /usr/local/bin/rose-auto-rca-tool

      - name: Reconcile every open Auto RCA lifecycle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_UPDATE_TOKEN }}
          AUTO_RCA_PR_TOKEN: ${{ secrets.GH_UPDATE_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
          DEFAULT_SLACK_CHANNEL: ${{ secrets.SLACK_ERROR_CHANNEL_ID }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          uuid_re='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          if [[ "${TRIGGER_RUN_ID:-}" =~ ^[0-9]+$ ]]; then
            search="actions/runs/$TRIGGER_RUN_ID in:body"
          else
            search='auto-RCA: Production agent failure in:title'
          fi
          prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --search "$search" --json title,url,body,headRefName,isDraft)"
          count="$(printf '%s' "$prs" | jq 'length')"
          for ((index = 0; index < count; index += 1)); do
            pr="$(printf '%s' "$prs" | jq -c ".[$index]")"
            title="$(printf '%s' "$pr" | jq -r '.title')"
            agent_id="${title#auto-RCA: Production agent failure }"
            [[ "$agent_id" =~ $uuid_re ]] || continue
            [ "$title" = "auto-RCA: Production agent failure $agent_id" ] || continue
            branch="$(printf '%s' "$pr" | jq -r '.headRefName')"
            short_id="$(printf '%s' "$agent_id" | tr -cd 'a-zA-Z0-9' | cut -c1-12)"
            if [ "$branch" != "auto-rca/$agent_id" ] && ! [[ "$branch" =~ ^auto-rca/${short_id}-[0-9]+$ ]]; then
              continue
            fi
            body="$(printf '%s' "$pr" | jq -r '.body // ""')"
            marker="$(printf '%s' "$body" | grep -oE '<!-- rca-slack ts=[^ ]* channel=[^ ]*( agent=[^ ]+ run=[^ ]+)? -->' | head -1 || true)"
            slack_ts="$(printf '%s' "$marker" | sed -nE 's/.*ts=([^ ]*).*/\1/p')"
            slack_channel="$(printf '%s' "$marker" | sed -nE 's/.*channel=([^ ]*).*/\1/p')"
            run_id="$(printf '%s' "$marker" | sed -nE 's/.* run=([^ ]+) -->/\1/p')"
            [ -n "$slack_channel" ] || slack_channel="$DEFAULT_SLACK_CHANNEL"
            [[ "$slack_channel" =~ ^[A-Z0-9]{9,32}$ ]] || continue
            [[ "$run_id" =~ ^[0-9]+$ ]] || continue
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" 2>/dev/null || printf '{}')"
            run_status="$(printf '%s' "$run" | jq -r '.status // "completed"')"
            if [ "$run_status" = completed ]; then
              if [ "$(printf '%s' "$pr" | jq -r '.isDraft')" = false ]; then
                state=ready
              else
                state=blocked
              fi
            else
              state=running
            fi
            response="$(curl -fsS --retry 3 --retry-all-errors --connect-timeout 5 --max-time 20 \
              "https://navi-j9a9.onrender.com/api/agents/$agent_id/alert-context" \
              -H "X-API-Key: $BACKEND_API_KEY" 2>/dev/null || true)"
            affected_user_name="$(printf '%s' "$response" | jq -r '.affected_user_name // "Affected user unavailable"' \
              | tr '\r\n\t' '   ' | tr -s ' ' | cut -c1-160)"
            output="$(mktemp "${RUNNER_TEMP:-/tmp}/auto-rca-reconcile.XXXXXX")"
            GITHUB_OUTPUT="$output" GITHUB_ENV='' \
            AGENT_ID="$agent_id" AFFECTED_USER_NAME="$affected_user_name" RCA_STATE="$state" \
            RCA_FE_URL="https://roselabs.ai/?agent-id=$agent_id" \
            RCA_PR_URL="$(printf '%s' "$pr" | jq -r '.url')" \
            RCA_RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id" \
            RCA_RECONCILE_SLACK=true SLACK_TS="$slack_ts" SLACK_CHANNEL="$slack_channel" \
              /usr/local/bin/rose-auto-rca-tool slack-update
            resolved_ts="$(sed -n 's/^ts=//p' "$output" | tail -1)"
            rm -f "$output"
            SLACK_TS="$resolved_ts" SLACK_CHANNEL="$slack_channel" AGENT_ID="$agent_id" \
            RCA_BRANCH="$branch" GITHUB_RUN_ID="$run_id" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
              /usr/local/bin/rose-auto-rca-tool bind-slack
          done
