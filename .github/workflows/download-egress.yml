name: Mac download egress health

on:
  schedule:
    - cron: "7-59/15 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: mac-download-egress-health
  cancel-in-progress: false

jobs:
  health:
    name: Synthetic, edge, and real-user download health
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Check out monitor
        uses: useblacksmith/checkout@v1 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4

      - name: Install monitor dependencies
        working-directory: back-end
        run: npm ci --ignore-scripts --workspaces=false

      - name: Run bounded download health monitor
        id: monitor
        continue-on-error: true
        working-directory: back-end
        env:
          DOWNLOAD_EGRESS_REPORT_PATH: ../.context/download-egress/report.json
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: tea-csppgi56l47c73djvpig
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: npx tsx scripts/download-egress-health.ts

      - name: Upload deep diagnostic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-download-egress-${{ github.run_id }}
          path: .context/download-egress/report.json
          if-no-files-found: warn
          retention-days: 90

      - name: Resolve previous monitor conclusion
        id: previous
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if ! previous_conclusion="$(
              gh api --method GET \
                "repos/$GITHUB_REPOSITORY/actions/workflows/download-egress.yml/runs" \
                -f status=completed \
                -f branch="$GITHUB_REF_NAME" \
                -f per_page=100 |
                jq -r --arg current "$GITHUB_RUN_ID" \
                  '[.workflow_runs[] |
                    select((.id | tostring) != $current) |
                    select(.conclusion == "success" or .conclusion == "failure")] |
                   sort_by(.updated_at) | reverse | .[0].conclusion // empty'
            )"; then
            previous_conclusion=""
          fi
          echo "conclusion=${previous_conclusion:-none}" >> "$GITHUB_OUTPUT"

      - name: Notify Slack on incident transition or recovery
        if: >-
          always() &&
          ((steps.monitor.outcome == 'failure' && steps.previous.outputs.conclusion != 'failure') ||
           (steps.monitor.outcome == 'success' && steps.previous.outputs.conclusion == 'failure'))
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_ERROR_CHANNEL_ID }}
          MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
          PREVIOUS_CONCLUSION: ${{ steps.previous.outputs.conclusion }}
        run: |
          report=.context/download-egress/report.json
          if [ -f "$report" ] && jq -e 'type == "object"' "$report" >/dev/null; then
            summary="$(jq -r '.summary // "Diagnostic report unavailable"' "$report")"
            report_status="$(jq -r '.status // "unknown"' "$report")"
            observability_failure_count="$(jq -r '(.observabilityFailures // []) | length' "$report")"
            report_available=true
          else
            summary='Monitor crashed before writing a diagnostic report'
            report_status=unknown
            observability_failure_count=0
            report_available=false
          fi
          if [ "$MONITOR_OUTCOME" = failure ]; then
            if [ "$report_available" != true ]; then
              heading=':rotating_light: Mac download monitor execution failure'
            elif [ "$report_status" = unhealthy ]; then
              heading=':rotating_light: Mac download egress incident'
            elif [ "$observability_failure_count" -gt 0 ]; then
              heading=':warning: Mac download observability degraded'
            else
              heading=':rotating_light: Mac download monitor execution failure'
            fi
          else
            heading=':white_check_mark: Mac download egress recovered'
          fi
          text="$heading
          $summary
          Deep report: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload="$(jq -n --arg channel "$SLACK_CHANNEL_ID" --arg text "$text" \
            '{channel: $channel, text: $text}')"
          response="$(curl -fsS --retry 3 --retry-all-errors --max-time 30 \
            https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$payload")"
          jq -e '.ok == true' <<< "$response" >/dev/null

      - name: Enforce monitor result
        if: steps.monitor.outcome == 'failure'
        run: exit 1
