name: Deploy Agents to Fly.io

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit to deploy
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "!agents/tests/**"
      - "!agents/benchmarks/**"
      - "!agents/**/*.md"
      - "!agents/scripts/run-coverage.sh"
      - "!agents/scripts/run_blackbox_tests.py"
      - "!agents/scripts/run_coverage_blackbox_parallel.py"
      - ".github/workflows/deploy-agents.yml"
      - "scripts/deploy-agents-cooperative-cutover.sh"
      - "scripts/agents-image-context.sh"
      - "scripts/worker_pool_*.py"
      - "scripts/retained_agent_machine.py"
      - "back-end/scripts/worker-deployment-queue.ts"
      - "back-end/src/providers/workerDeployment*.ts"

permissions:
  contents: read
  # write: the self-driving cutover posts an agent-cutover commit status
  # (release()) to record cutover success/failure for observers.
  statuses: write

# Every run must enqueue its immutable release. GitHub concurrency keeps only
# one pending run; production FIFO ownership is instead held in Postgres.

jobs:
  deploy:
    name: Deploy to Fly.io
    if: github.event_name != 'schedule'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Verify manual deployment source
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$EXPECTED_SHA" = "$GITHUB_SHA"

      - uses: useblacksmith/checkout@v1
        with:
          persist-credentials: false
          fetch-depth: 2
          # A full checkout downloads ~3.3 GB (2.8 GB is agents/benchmarks
          # history the worker image excludes) and cost ~4 min per run. Fetch
          # trees only and materialize everything except unused heavy paths.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/agents/benchmarks/
            !/front-end/public/
            !/claude-code-src/

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      - name: Compute workflow replay-surface generation hash
        id: surface
        run: |
          # Replay compatibility remains content-addressed. Every durable job
          # receives its own queue, including jobs with the same surface hash.
          SURFACE_HASH=$(python3 scripts/agent_workflow_surface_hash.py)
          echo "hash=$SURFACE_HASH" >> "$GITHUB_OUTPUT"
          echo "Workflow surface generation: $SURFACE_HASH"

      - name: Resolve Fly app name from fly.toml
        id: flyapp
        run: |
          APP=$(grep -E '^\s*app\s*=' agents/fly.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$APP" ]; then
            echo "Could not read app from agents/fly.toml" >&2
            exit 1
          fi
          echo "name=$APP" >> "$GITHUB_OUTPUT"
          echo "Fly app: $APP"

      # Build before queuing. The shared deployment lease and durable bank
      # reservations serialize every controller, including non-GitHub callers.
      # Old work keeps its bank until positive retirement; no force-clear and
      # no per-deployment Machine allocation.
      - name: Cooperative Fly deploy + generation cutover
        id: cutover
        # Interruption retains the queued job, stage and Machine reservations.
        timeout-minutes: 90
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_CONTEXT: agent-cutover/${{ github.run_id }}-${{ github.run_attempt }}
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
          TEMPORAL_ADDRESS: ${{ secrets.TEMPORAL_ADDRESS }}
          TEMPORAL_NAMESPACE: ${{ secrets.TEMPORAL_NAMESPACE }}
          TEMPORAL_API_KEY: ${{ secrets.TEMPORAL_API_KEY }}
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
          BACKEND_API_URL: https://navi-j9a9.onrender.com
          SURFACE_HASH: ${{ steps.surface.outputs.hash }}
          BUILD_ID: ${{ github.sha }}
          DEPLOYMENT_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
          DEPLOY_REUSE_ONLY: "1"
          APP: ${{ steps.flyapp.outputs.name }}
        run: |
          set -euo pipefail
          release() {
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -X POST \
              -f state="$1" -f context="$RELEASE_CONTEXT" -f description="$2" >/dev/null || true
          }
          trap 'release error "cooperative cutover failed (check old/new gen fleets)"' ERR
          bash scripts/deploy-agents-cooperative-cutover.sh
          release success "reusable worker-bank cutover completed"
          trap - ERR

  recover:
    name: Resume interrupted worker deployment
    if: github.event_name == 'schedule'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    # This limits duplicate observers only. It never holds an unpersisted deploy.
    concurrency:
      group: recover-agent-pool
      cancel-in-progress: false
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/agents/benchmarks/
            !/front-end/public/
            !/claude-code-src/
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: back-end/package-lock.json
      - name: Resume the saved FIFO head without rebuilding or enqueuing
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
          TEMPORAL_ADDRESS: ${{ secrets.TEMPORAL_ADDRESS }}
          TEMPORAL_NAMESPACE: ${{ secrets.TEMPORAL_NAMESPACE }}
          TEMPORAL_API_KEY: ${{ secrets.TEMPORAL_API_KEY }}
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
          BACKEND_API_URL: https://navi-j9a9.onrender.com
        run: |
          set -euo pipefail
          APP=$(sed -nE 's/^app = "([a-z0-9-]+)"/\1/p' agents/fly.toml)
          cd back-end
          npm ci --workspaces=false --ignore-scripts
          npx prisma generate
          HEAD_JOB=$(node --import tsx scripts/worker-deployment-queue.ts head --app "$APP")
          JOB_ID=$(printf '%s' "$HEAD_JOB" | node --input-type=module -e '
            let body=""; for await (const chunk of process.stdin) body+=chunk;
            const job=JSON.parse(body); if(job) process.stdout.write(job.jobId);')
          [ -n "$JOB_ID" ] || exit 0
          node --import tsx scripts/worker-deployment-queue.ts run \
            --job-id "$JOB_ID" --if-idle -- python3 ../scripts/worker_pool_cutover.py
