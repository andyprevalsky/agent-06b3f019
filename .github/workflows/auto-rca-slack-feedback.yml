name: Auto RCA — ingest Slack feedback

on:
  repository_dispatch:
    types: [agent-rca-feedback]

concurrency:
  group: auto-rca-slack-feedback-${{ github.event.client_payload.slack_event_id || github.run_id }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout trusted lifecycle code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Install trusted lifecycle broker
        run: sudo install -o root -g root -m 0555 scripts/auto-rca-tool /usr/local/bin/rose-auto-rca-tool

      - name: Resolve the lifecycle PR and durably queue feedback
        id: ingest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_UPDATE_TOKEN }}
          SLACK_CHANNEL: ${{ github.event.client_payload.slack_channel }}
          SLACK_THREAD_TS: ${{ github.event.client_payload.slack_thread_ts }}
          SLACK_MESSAGE_TS: ${{ github.event.client_payload.slack_message_ts }}
          SLACK_USER_ID: ${{ github.event.client_payload.slack_user_id }}
          SLACK_EVENT_ID: ${{ github.event.client_payload.slack_event_id }}
          REVIEW_FEEDBACK: ${{ github.event.client_payload.feedback }}
        run: |
          set -euo pipefail
          [[ "$SLACK_CHANNEL" =~ ^[A-Z0-9]{9,32}$ ]] || { echo 'Invalid Slack channel' >&2; exit 1; }
          [[ "$SLACK_THREAD_TS" =~ ^[0-9]{10,}\.[0-9]{6}$ ]] || { echo 'Invalid Slack thread' >&2; exit 1; }
          [[ "$SLACK_MESSAGE_TS" =~ ^[0-9]{10,}\.[0-9]{6}$ ]] || { echo 'Invalid Slack message' >&2; exit 1; }
          [[ "$SLACK_USER_ID" =~ ^[UW][A-Z0-9]{8,32}$ ]] || { echo 'Invalid Slack user' >&2; exit 1; }
          [[ "$SLACK_EVENT_ID" =~ ^Ev[A-Za-z0-9]{8,64}$ ]] || { echo 'Invalid Slack event' >&2; exit 1; }
          [ -n "$REVIEW_FEEDBACK" ] && [ "${#REVIEW_FEEDBACK}" -le 8000 ] || {
            echo 'Slack feedback must contain 1..8000 characters' >&2; exit 1;
          }

          open_pr_pages="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100")"
          pr="$(printf '%s' "$open_pr_pages" | /usr/local/bin/rose-auto-rca-tool select-slack-prs)"
          pr_number="$(printf '%s' "$pr" | jq -r '.number')"
          [[ "$pr_number" =~ ^[0-9]+$ ]] || { echo 'Resolved PR number is invalid' >&2; exit 1; }

          marker="<!-- rca-slack-feedback event=$SLACK_EVENT_ID channel=$SLACK_CHANNEL thread=$SLACK_THREAD_TS message=$SLACK_MESSAGE_TS user=$SLACK_USER_ID -->"
          comments="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$pr_number/comments?per_page=100")"
          if printf '%s' "$comments" | jq -e --arg marker "$marker" \
            'any(.[][]?; ((.body // "") | startswith($marker)))' >/dev/null; then
            printf 'Slack event %s was already queued.\n' "$SLACK_EVENT_ID"
            exit 0
          fi

          printf -v body '%s\n\n%s' "$marker" "$REVIEW_FEEDBACK"
          jq -n --arg body "$body" '{body:$body}' | gh api \
            "repos/$GITHUB_REPOSITORY/issues/$pr_number/comments" --method POST --input - >/dev/null
          printf 'Queued Slack feedback on PR #%s.\n' "$pr_number"

      - name: Acknowledge the exact Slack feedback message
        id: acknowledge
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ github.event.client_payload.slack_channel }}
          SLACK_MESSAGE_TS: ${{ github.event.client_payload.slack_message_ts }}
        run: |
          set -euo pipefail
          payload="$(jq -n --arg c "$SLACK_CHANNEL" --arg ts "$SLACK_MESSAGE_TS" \
            '{channel:$c,name:"eyes",timestamp:$ts}')"
          response="$(curl -sS --fail-with-body --retry 3 --retry-all-errors \
            -X POST https://slack.com/api/reactions.add \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-Type: application/json; charset=utf-8' --data "$payload")"
          printf '%s' "$response" | jq -e '.ok == true or .error == "already_reacted"' >/dev/null

      - name: Tell the Slack thread the exact failed handoff step
        if: failure()
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ github.event.client_payload.slack_channel }}
          SLACK_THREAD_TS: ${{ github.event.client_payload.slack_thread_ts }}
          FAILED_STEP: ${{ steps.ingest.outcome != 'success' && '/RCA · Slack feedback ingest' || '/RCA · Slack eyes acknowledgement' }}
        run: |
          set -euo pipefail
          [[ "$SLACK_CHANNEL" =~ ^[A-Z0-9]{9,32}$ ]] || exit 0
          [[ "$SLACK_THREAD_TS" =~ ^[0-9]{10,}\.[0-9]{6}$ ]] || exit 0
          payload="$(jq -n --arg c "$SLACK_CHANNEL" --arg ts "$SLACK_THREAD_TS" \
            --arg t "I could not finish that feedback handoff. Failed step: $FAILED_STEP. The GitHub Actions ingest run has the error details." \
            '{channel:$c,thread_ts:$ts,text:$t}')"
          response="$(curl -sS --fail-with-body --retry 3 --retry-all-errors \
            -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-Type: application/json; charset=utf-8' --data "$payload")"
          printf '%s' "$response" | jq -e '.ok == true' >/dev/null
