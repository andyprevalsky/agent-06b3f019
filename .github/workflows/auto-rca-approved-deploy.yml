name: Auto RCA — deploy approved fix

on:
  pull_request_review:
    types: [submitted]

concurrency:
  group: auto-rca-deploy-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.review.state == 'approved' &&
      github.event.review.user.type == 'User' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false &&
      startsWith(github.event.pull_request.head.ref, 'auto-rca/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      pull-requests: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      PR_DRAFT: ${{ github.event.pull_request.draft }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      REVIEW_COMMIT_SHA: ${{ github.event.review.commit_id }}
      REVIEWER: ${{ github.event.review.user.login }}

    steps:
      - name: Checkout trusted lifecycle code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Install trusted lifecycle broker
        run: |
          sudo install -o root -g root -m 0555 scripts/auto-rca-tool /usr/local/bin/rose-auto-rca-tool
          sudo install -o root -g root -m 0555 scripts/check-prompt-human-approval.sh /usr/local/bin/rose-prompt-approval-guard
          sudo install -o root -g root -m 0555 scripts/check-agent-behavior-approval.sh /usr/local/bin/rose-agent-behavior-approval-guard

      - name: Validate exact-head trusted RCA contract
        id: contract
        shell: bash
        run: /usr/local/bin/rose-auto-rca-tool approved-deploy-plan

      - name: Validate human reviewer authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$REVIEWER/permission" --jq '.permission')"
          case "$permission" in
            admin|maintain|write) ;;
            *) echo 'Approved deploy requires a reviewer with write permission.' >&2; exit 1 ;;
          esac
          decision="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json reviewDecision --jq '.reviewDecision')"
          [ "$decision" = APPROVED ] || { echo 'The PR review decision is not APPROVED.' >&2; exit 1; }

      - name: Refuse approval while reviewer feedback is queued
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          comment_pages="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100")"
          pending="$(printf '%s' "$comment_pages" | TRIGGER_COMMENT_ID=1 \
            /usr/local/bin/rose-auto-rca-tool feedback-batch)"
          [ "$(printf '%s' "$pending" | jq 'length')" -eq 0 ] || {
            echo 'Unprocessed reviewer feedback exists; the RCA must revise before merge.' >&2; exit 1;
          }
          ingest_runs="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/auto-rca-slack-feedback.yml/runs?per_page=100")"
          [ "$(printf '%s' "$ingest_runs" | jq '[.workflow_runs[] | select(.status != "completed")] | length')" -eq 0 ] || {
            echo 'Slack feedback is still being durably ingested; refusing to race it.' >&2; exit 1;
          }

      - name: Wait for the trusted RCA workflow to finish green
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RCA_RUN_ID: ${{ steps.contract.outputs.run_id }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 40); do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RCA_RUN_ID")"
            status="$(printf '%s' "$run" | jq -r '.status')"
            conclusion="$(printf '%s' "$run" | jq -r '.conclusion // ""')"
            workflow="$(printf '%s' "$run" | jq -r '.name')"
            [ "$workflow" = 'Auto RCA' ] || { echo 'Verified run is not Auto RCA.' >&2; exit 1; }
            if [ "$status" = completed ]; then
              [ "$conclusion" = success ] || {
                echo "Auto RCA run completed with $conclusion." >&2; exit 1;
              }
              exit 0
            fi
            sleep 15
          done
          echo 'Timed out waiting for the trusted Auto RCA run.' >&2
          exit 1

      - name: Checkout the exact approved RCA head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Apply formal exact-head approval to deferred human gates
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$PR_HEAD_SHA" ] || {
            echo 'Approval guard checkout does not match the reviewed HEAD.' >&2; exit 1;
          }
          /usr/local/bin/rose-prompt-approval-guard \
            mandatory-human-approval-retrieved=true --base-ref=origin/main
          /usr/local/bin/rose-agent-behavior-approval-guard \
            mandatory-human-approval-retrieved=true --base-ref=origin/main

      - name: Merge the exact approved RCA head
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_UPDATE_TOKEN }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          [ "$(printf '%s' "$current" | jq -r '.head.sha')" = "$PR_HEAD_SHA" ] || {
            echo 'PR head changed after approval.' >&2; exit 1;
          }
          [ "$(printf '%s' "$current" | jq -r '.draft')" = false ] || {
            echo 'PR returned to draft after approval.' >&2; exit 1;
          }
          [ "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json reviewDecision --jq '.reviewDecision')" = APPROVED ] || {
            echo 'PR approval was dismissed before merge.' >&2; exit 1;
          }
          comment_pages="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100")"
          pending="$(printf '%s' "$comment_pages" | TRIGGER_COMMENT_ID=1 \
            /usr/local/bin/rose-auto-rca-tool feedback-batch)"
          [ "$(printf '%s' "$pending" | jq 'length')" -eq 0 ] || {
            echo 'Reviewer feedback arrived during approval; refusing to merge.' >&2; exit 1;
          }
          ingest_runs="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/auto-rca-slack-feedback.yml/runs?per_page=100")"
          [ "$(printf '%s' "$ingest_runs" | jq '[.workflow_runs[] | select(.status != "completed")] | length')" -eq 0 ] || {
            echo 'Slack feedback arrived during approval; refusing to merge.' >&2; exit 1;
          }
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge \
            --match-head-commit "$PR_HEAD_SHA"
