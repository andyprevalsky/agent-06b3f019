"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
run = "bash scripts/run.sh"
run_mode = "concurrent"
setup = "cd back-end && npm install && cd ../front-end && npm install && cd ../mac-app && source ~/.nvm/nvm.sh && nvm use 20.10.0 && npm install && cd ../agents && python3 -m venv venv && source venv/bin/activate && pip install -r requirements.txt && cd .. && ln -sf \"$CONDUCTOR_ROOT_PATH/back-end/.env\" back-end/.env && ln -sf \"$CONDUCTOR_ROOT_PATH/agents/.env\" agents/.env && ln -sf \"$CONDUCTOR_ROOT_PATH/front-end/.env\" front-end/.env && ln -sf \"$CONDUCTOR_ROOT_PATH/mac-app/.env\" mac-app/.env && bash scripts/setup-db.sh"
