[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# Treat warnings as failures to catch silent deprecations, but allow some noise
# from pydantic/dspy stubs.
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["."]
branch = false
omit = [
  "tests/*",
  "__init__.py",
  "runtime/__init__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
