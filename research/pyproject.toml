[tool.ruff]
target-version = "py311"
line-length = 100
src = ["gepa", "."]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # isort
  "N",      # pep8-naming
  "UP",     # pyupgrade
  "B",      # flake8-bugbear
  "SIM",    # flake8-simplify
  "RUF",    # ruff-specific
]
ignore = [
  "E501",   # line too long (handled by formatter)
  "E741",   # ambiguous variable name (common in math/ML code)
]

[tool.ruff.lint.isort]
known-first-party = ["gepa", "research"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
