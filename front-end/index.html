<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, minimal-ui"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f9f9fb" />
    <script>
      // Pre-paint theme: apply the persisted Rose theme before first paint so the
      // page and the status bar never flash the wrong color. Prefers the
      // last-active account ('rose-theme-active' = userId, written by
      // RoseThemeProvider) and its 'rose-theme:<userId>' = 'dark' | 'light'
      // (localStorage, cookie backup). Without an active account: dark only when
      // every stored choice on the device is dark.
      (function () {
        try {
          var choice = function (id) {
            var v = localStorage.getItem('rose-theme:' + id);
            if (v === 'dark' || v === 'light') return v;
            var pairs = document.cookie ? document.cookie.split(';') : [];
            var name = 'rose-theme%3A' + encodeURIComponent(id) + '=';
            for (var c = 0; c < pairs.length; c++) {
              var part = pairs[c].trim();
              if (part.indexOf(name) === 0) {
                var cv = part.slice(name.length);
                if (cv === 'dark' || cv === 'light') return cv;
              }
            }
            return null;
          };
          // Blur-lab preset A (diagnostic, only ever stored via ?blurlab=1):
          // set the status-bar meta before parse completes so iOS can read it.
          if (localStorage.getItem('rose.blurlab.preset') === 'A') {
            var sb = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
            if (sb) sb.setAttribute('content', 'black-translucent');
          }
          var active = localStorage.getItem('rose-theme-active');
          var picked = active ? choice(active) : null;
          if (active && picked === null) picked = 'light'; // known account, nothing stored: provider default
          var dark = picked === 'dark';
          if (picked === null) {
            var any = false;
            var light = false;
            var pairs2 = document.cookie ? document.cookie.split(';') : [];
            for (var c2 = 0; c2 < pairs2.length; c2++) {
              var p2 = pairs2[c2].trim();
              if (p2.indexOf('rose-theme%3A') === 0) {
                var v2 = p2.slice(p2.indexOf('=') + 1);
                if (v2 === 'dark') any = true;
                else if (v2 === 'light') light = true;
              }
            }
            for (var i = 0; i < localStorage.length; i++) {
              var key = localStorage.key(i);
              if (key && key.indexOf('rose-theme:') === 0) {
                var v = localStorage.getItem(key);
                if (v === 'dark') any = true;
                else if (v === 'light') light = true;
              }
            }
            dark = any && !light;
          }
          if (dark) {
            var root = document.documentElement;
            root.classList.add('dark');
            root.setAttribute('data-rose-predark', '');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#272725');
          }
        } catch (e) {
          /* storage unavailable: stay light until React mounts */
        }
      })();
    </script>
    <meta name="apple-mobile-web-app-title" content="Rose" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script type="module">
      if (import.meta.env.DEV && import.meta.env.VITE_ENABLE_REACT_GRAB !== 'false') {
        import('react-grab');
      }
    </script>

  <body>
    <div id="root">
      <footer class="rose-static-links">
        <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a>
      </footer>
    </div>
    <style>
      .rose-static-links {
        background: #fafafa;
        color: #6a6a6f;
        font:
          11px/1.25 system-ui,
          sans-serif;
        padding: 4px max(8px, calc((100vw - 1200px) / 2));
        text-align: center;
      }
      .rose-static-links a {
        color: #535359;
        margin-left: 4px;

    </style>
    <script>
      // Hide Safari UI on iOS by scrolling slightly on load
      if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
        window.addEventListener('load', function () {
          setTimeout(function () {
            window.scrollTo(0, 1);
          }, 0);
        });

        // Hide Safari UI on scroll
        let lastScrollTop = 0;
        window.addEventListener(
          'scroll',
          function () {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > lastScrollTop) {
              // Scrolling down - Safari will auto-hide UI
            }
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
          },
          false,
        );
      }
    </script>
    <script>
      // STATE MACHINE: entry-load recovery (before the bundle, so it survives its loss)
      // [LOADING] --entry module script loads--> [MOUNTED] (appVersion.ts owns later reloads)
      // [LOADING] --entry module graph fails (error event)--> [WAITING] 0.5s/1s/2s backoff
      // [WAITING] --timer fires online--> [REVALIDATING] (charges 1 of 3 attempts per entry URL)
      // [REVALIDATING] --entry refetched past the HTTP cache (or 5s), online--> [RELOADING]
      // [REVALIDATING] --offline after the refetch--> [OFFLINE_CHARGED] --online event--> [REVALIDATING]
      // [WAITING] --timer fires offline--> [OFFLINE] --online event--> [REVALIDATING]
      // [LOADING] --budget for this entry URL spent--> [STATIC] (links only)
      // A document can outlive its deploy (edge-cached HTML across a production alias
      // switch); its hashed entry chunks then 404 and React never mounts, leaving only
      // the static links above. src/lib/appVersion.ts runs inside that bundle, so the
      // recovery must live here. Reloading fetches the live build's HTML.
      // Vercel answers a missing /assets/* file with 404 plus that path's year-long
      // immutable Cache-Control, and a reload replays such a cached 404 without asking
      // the network. Refetch the entry with cache: 'reload' first so the browser cache
      // holds the edge's current answer when the reloaded document requests it.
      (function () {
        // Every browser that runs module scripts has fetch and Promise.
        function revalidate(src) {
          return Promise.race([
            fetch(src, { cache: 'reload', credentials: 'same-origin' }).catch(function () {}),
            new Promise(function (resolve) {
              setTimeout(resolve, 5000);
            }),
          ]);
        }
        var scheduled = false;
        function attemptsFor(key) {
          try {
            return Number(sessionStorage.getItem(key)) || 0;
          } catch (_) {
            // Storage disabled: window.name survives a same-tab reload (one attempt).
            return window.name.indexOf('[' + key + ']') === -1 ? 0 : 3;
          }
        }
        function reload(src, key, attempts) {
          // Charge the attempt only when the reload runs; an offline reload would replace
          // the static links with the browser's offline page.
          if (navigator.onLine === false) {
            window.addEventListener('online', reload.bind(null, src, key, attempts), {
              once: true,
            });
            return;
          }
          try {
            sessionStorage.setItem(key, String(attempts + 1));
          } catch (_) {
            window.name += '[' + key + ']';
          }
          revalidateAndReload(src);
        }
        // The attempt is already charged. If connectivity drops while revalidating, wait for
        // online and revalidate again instead of navigating to the browser's offline page.
        function revalidateAndReload(src) {
          revalidate(src).then(function () {
            if (navigator.onLine === false) {
              window.addEventListener('online', revalidateAndReload.bind(null, src), {
                once: true,
              });
              return;
            }
            location.reload();
          });
        }
        window.addEventListener(
          'error',
          function (event) {
            var script = event.target;
            if (!(script instanceof HTMLScriptElement) || script.type !== 'module' || !script.src)
              return;
            var key = 'rose:entry-reload:' + script.src;
            var attempts = attemptsFor(key);
            if (scheduled || attempts >= 3) return;
            scheduled = true;
            console.warn('[EntryLoad] ' + script.src + ' failed to load; reloading');
            setTimeout(reload.bind(null, script.src, key, attempts), 500 * Math.pow(2, attempts));
          },
          true,
        );
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
