# fly.toml app configuration file generated for navi-temporal-agents
# 
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "navi-whisper-lux"
primary_region = "iad"  # Ashburn, Virginia

# Fly Machines cap stop_config.timeout at 5 minutes (API rejects anything
# higher with "invalid stop_config.timeout, cannot exceed 5 minutes"). Longer
# in-flight work (e.g. 30m browser) must drain via cooperative generation
# cutover (continue_as_new at activity boundaries), not kill_timeout.
kill_signal = "SIGTERM"
kill_timeout = "5m"

[build]
  dockerfile = "Dockerfile"

[env]
  # Fallback for code paths that carry no per-session provider (the backend picks the provider per
  # browser session; Render runs tilion). Andy chose Tilion everywhere on 2026-11-06.
  BROWSER_PROVIDER = "tilion"

  # Python configuration
  PYTHONUNBUFFERED = "1"
  PYTHON_VERSION = "3.11"

  # Environment setting - CRITICAL: Must be "production" to use production Supabase URL
  ENVIRONMENT = "production"
  
  # Temporal Worker Configuration
  # These control concurrency and resource usage
  MIN_MACHINES = "8"
  MAX_MACHINES = "40"
  MAX_CONCURRENT_ACTIVITIES = "250"
  MAX_CONCURRENT_WORKFLOWS = "100"
  MAX_CACHED_WORKFLOWS = "100"
  MAX_CONCURRENT_ACTIVITY_TASK_POLLERS = "5"
  MAX_CONCURRENT_WORKFLOW_TASK_POLLERS = "5"
  STICKY_QUEUE_SCHEDULE_TO_START_TIMEOUT_SECONDS = "10"
  
  # Worker tuning
  HEALTH_CHECK_PORT = "8080"
  # Match Fly's 5m kill_timeout cap. Longer activities drain via cooperative
  # generation cutover, not process-local shutdown grace.
  WORKER_SHUTDOWN_GRACE_PERIOD = "5m"
  MAX_HEARTBEAT_THROTTLE_INTERVAL = "60s"
  DEFAULT_HEARTBEAT_THROTTLE_INTERVAL = "30s"
  MEMORY_SCALE_UP_THRESHOLD_PERCENT = "80"
  MEMORY_CRITICAL_SCALE_UP_THRESHOLD_PERCENT = "90"
  
  # Activity timeouts (in seconds)
  ACTIVITY_START_TO_CLOSE_TIMEOUT = "300"  # 5 minutes default
  ACTIVITY_SCHEDULE_TO_CLOSE_TIMEOUT = "600"  # 10 minutes default
  ACTIVITY_HEARTBEAT_TIMEOUT = "30"
  
  # Workflow timeouts - NO EXECUTION TIMEOUT (runs until success or manual termination)
  WORKFLOW_TASK_TIMEOUT = "10"
  
  # Retry policies - EXTREME BACKOFF
  ACTIVITY_MAX_ATTEMPTS = "6"
  ACTIVITY_RETRY_BACKOFF_COEFFICIENT = "4.0"  # 4x multiplier
  ACTIVITY_RETRY_INITIAL_INTERVAL = "2"  # Start at 2 seconds
  ACTIVITY_RETRY_MAX_INTERVAL = "64"  # Cap at 64 seconds
  
  # Task queue
  TASK_QUEUE = "navi-agent-tasks"

# Secrets (set via: fly secrets set TEMPORAL_API_KEY=...)
# TEMPORAL_API_KEY
# TEMPORAL_NAMESPACE
# TEMPORAL_ADDRESS
# FLY_API_TOKEN (for built-in autoscaler to start/stop machines via Fly Machines API)
# OPENROUTER_API_KEY (for LLM capabilities - replaces OPENAI_API_KEY)
# SERPER_API_KEY (for web search)
# SUPABASE_URL
# SUPABASE_KEY (for knowledge base)
# TWILIO_ACCOUNT_SID (for SMS)
# TWILIO_AUTH_TOKEN
# TWILIO_PHONE_NUMBER
# BACKEND_API_URL (optional, defaults to https://navi-j9a9.onrender.com)
# BACKEND_API_KEY (for blueprint search)

[http_service]
  internal_port = 8080
  force_https = true
  # Custom autoscaler (poll_queue_metrics in worker.py) manages machine lifecycle.
  # Both must be false — auto_start fights the autoscaler by restarting stopped machines.
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 8
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

  # Health check for the worker
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

# VM Resources - adjust based on needs
[[vm]]
  cpu_kind = "performance"
  cpus = 1
  memory_mb = 2048

# Note: Built-in proxy autoscaling is intentionally not configured.
# Workers self-scale via built-in adaptive controller (see poll_queue_metrics in worker.py).
# Leader election via Fly DNS; leader actuates via Fly Machines API. No separate autoscaler app needed.

[metrics]
  port = 8080
  path = "/metrics"
