# =============================================================================
# Ruff configuration for agents/ Python codebase
#
# Two-tier lint enforcement (mirrors back-end/eslint.config.mjs pattern):
#   1. Base rules   — all source files (this file)
#   2. Strict rules — cleaned domain files only (ruff-strict.toml)
#
# Commands:
#   ruff check .                                    # base lint (all files)
#   ruff format --check .                           # format check (all files)
#   ruff check --config ruff-strict.toml <files>    # strict lint (cleaned domains)
# =============================================================================

[tool.ruff]
target-version = "py311"
line-length = 120

# Exclude non-source directories
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    "benchmarks",
    "browser_tools",
]

# ── Formatter ──
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ── Lint: base rules (all source files) ──
[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "TID252",  # flake8-tidy-imports: banned-api (enforce canonical utils/)
]

ignore = [
    "E501",  # line-too-long — handled by formatter
    "W291",  # trailing whitespace — handled by formatter
    "W292",  # no newline at end of file — handled by formatter
    "W293",  # whitespace before ':'  — handled by formatter
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = [
    "config",
    "domains",
    "tools",
    "helpers",
    "utils",
    "loop",
    "activities",
    "workflows",
    "browser_tools",
]

# Per-file rule relaxations
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["I", "F401", "F841", "E402", "F541", "E712", "E722"]
"scripts/**/*.py" = ["I"]
# Composition root: imports after load_dotenv() + env var check (intentional)
"worker.py" = ["E402"]
# Activity-only imports after sys.path setup (intentional)
"tools/knowledge_base.py" = ["E402"]

# ── Banned APIs: enforce canonical utils/ imports ──
# Modules moved from helpers/ to utils/. helpers.* aliases are removed; imports
# must use the canonical utils.* path.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"helpers.error_utils".msg = "Moved to utils.error_utils — use `from utils.error_utils import ...`."
"helpers.format_tool_display".msg = "Moved to utils.format_tool_display — use `from utils.format_tool_display import ...`."
"helpers.prompts".msg = "Moved to utils.prompts — use `from utils.prompts import ...`."
"helpers.terminal_filter".msg = "Moved to utils.terminal_filter — use `from utils.terminal_filter import ...`."
"helpers.usage".msg = "Moved to utils.usage — use `from utils.usage import ...`."
"helpers.utils".msg = "Moved to utils.utils — use `from utils.utils import ...`."
"helpers.tool_schemas".msg = "Moved to utils.tool_schemas — use `from utils.tool_schemas import ...`."

# =============================================================================
# Coverage configuration (coverage.py)
#
# Commands:
#   coverage run scripts/run_blackbox_tests.py && coverage report
#   coverage html    # detailed HTML report
#
# Threshold is a ratchet: only move it up, never down. Bump after adding tests.
# Target: 80% line coverage. Bump toward 80% as new tests land.
# =============================================================================
[tool.coverage.run]
branch = true
source = [
    "config.py",
    "domains",
    "tools",
    "helpers",
    "utils",
    "loop",
    "activities",
    "workflows",
]
omit = [
    "tests/*",
    "benchmarks/*",
    "browser_tools/*",
    "scripts/*",
    "*/__pycache__/*",
    "venv/*",
    ".venv/*",
    "worker.py",
    "health_server.py",
    "test_ttft.py",
]

[tool.coverage.report]
# Ratchet: only move up, never down. Bump after adding tests.
# Target: 80%. Current: 81%.
fail_under = 80
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
