# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"
early_access: false

tone_instructions: >-
  Focus on bugs, security vulnerabilities, logic errors, race conditions, and
  correctness issues. Do NOT comment on style, naming, logging format, or code
  organization unless it introduces a bug.

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: false
  poem: false
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  in_progress_fortune: false
  changed_files_summary: true
  suggested_labels: false
  suggested_reviewers: false
  related_prs: false

  auto_review:
    enabled: true
    # /deploy batches all post-open changes and requests one incremental review
    # only after the local gates stabilize. Reviewing every intermediate push
    # wastes reviewer capacity and repeatedly rate-limits later deploys.
    auto_incremental_review: false
    # Defense in depth if a human explicitly resumes automatic reviews.
    auto_pause_after_reviewed_commits: 2
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "DO NOT REVIEW"

  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!**/pnpm-lock.yaml"
    - "!**/uv.lock"
    - "!back-end/src/routes/**"
    - "!claude-code-src/**"
    # Free-tier 150-file cap: anything below is covered by /deploy's local
    # gates (lint/tsc/structural/blackbox/smoke/semantic) and rarely contains
    # logic regressions worth a remote review pass.
    # 1) Tests — already gated locally; retain review of the raw Chromium launcher fixture
    - "!**/tests/**/!(browser_tilion.blackbox.py)"
    - "!**/*.blackbox.ts"
    - "!**/*.blackbox.tsx"
    - "!**/!(browser_tilion).blackbox.py"
    - "!**/*.test.ts"
    - "!**/*.test.tsx"
    - "!**/*.test.py"
    - "!**/*.spec.ts"
    - "!**/test_*.py"
    - "!front-end/tests-e2e/**"
    # 2) Benchmark harness — gated by the smoke run
    - "!agents/benchmarks/**"
    # 3) Prompt strings (no logic)
    - "!agents/tools/prompts/**"
    # 4) Docs, markdown, harness config
    # Keep this recovery utility and its records in review scope.
    - "!docs/!(handoffs)/**"
    - "!docs/handoffs/!(pr-1831-closeout|pr-1857-closeout|pr-1859-closeout|pr-1885-closeout)/**"
    - "!*.md"
    - "!**/!(pr-1831-closeout|pr-1857-closeout|pr-1859-closeout|pr-1885-closeout)/*.md"
    - "!.claude/**"
    - "!.coderabbit.yaml"
    - "!.gitignore"
    - "!.editorconfig"
    - "!**/eslint.config.*"
    # 5) Python scaffolding (re-exports + dataclass configs/types + thin HTTP repo wrappers)
    - "!**/__init__.py"
    - "!agents/**/config.py"
    - "!agents/**/types.py"
    - "!agents/**/repo.py"
    # 6) Non-runtime assets, dev previews, and local/debug scripts
    - "!agents/keycap/COPYING"
    - "!agents/keycap/LICENSE"
    - "!front-end/browser-chip-preview.html"
    - "!front-end/src/dev/**"
    - "!scripts/render_llm_dump.py"
    - "!scripts/replicate_llm_dump.py"
    - "!back-end/scripts/e2e-credential-backprop-state.ts"
    - "!back-end/scripts/run-coverage.sh"
    - "!back-end/scripts/sync-codex-token.ts"

  path_instructions:
    - path: "agents/**"
      instructions: |
        Focus on: bugs, race conditions, Temporal determinism violations,
        incorrect error handling, security issues, and logic errors.
        Do NOT flag: logging format, naming conventions, import ordering,
        missing docstrings, or code style preferences.
    - path: "back-end/**"
      instructions: |
        Focus on: SQL injection, auth bypasses, missing input validation,
        incorrect Prisma queries, error handling bugs, and API contract violations.
        Do NOT flag: logging format, variable naming, or style preferences.
    - path: "front-end/**"
      instructions: |
        Focus on: state management bugs, memory leaks, incorrect hook usage,
        missing error boundaries, security issues (XSS, data exposure).
        Do NOT flag: CSS style preferences, component naming, or import ordering.
    - path: "research/**"
      instructions: |
        Focus on: security issues in edge functions, incorrect API responses,
        and error handling bugs. Ignore style.

  tools:
    # Security tools — keep enabled
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    checkov:
      enabled: true
    trivy:
      enabled: true
    osvScanner:
      enabled: true
    semgrep:
      enabled: true
    opengrep:
      enabled: true

    # Bug-finding tools — keep enabled
    shellcheck:
      enabled: true
    hadolint:
      enabled: true
    actionlint:
      enabled: true
    eslint:
      enabled: true
    ruff:
      enabled: true

    # Style-heavy tools — disabled
    languagetool:
      enabled: false
    markdownlint:
      enabled: false
    biome:
      enabled: false
    pylint:
      enabled: false
    flake8:
      enabled: false
    phpstan:
      enabled: false
    phpmd:
      enabled: false
    phpcs:
      enabled: false
    rubocop:
      enabled: false
    stylelint:
      enabled: false
    detekt:
      enabled: false

  slop_detection:
    enabled: true

knowledge_base:
  code_guidelines:
    enabled: false
  learnings:
    scope: "auto"
  web_search:
    enabled: true

chat:
  auto_reply: true
