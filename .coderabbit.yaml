# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"
early_access: false

tone_instructions: >-
  Focus on bugs, security vulnerabilities, logic errors, race conditions, and
  correctness issues. Do NOT comment on style, naming, logging format, or code
  organization unless it introduces a bug.

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: false
  poem: false
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  in_progress_fortune: false
  changed_files_summary: true
  suggested_labels: false
  suggested_reviewers: false
  related_prs: false

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "DO NOT REVIEW"

  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!**/pnpm-lock.yaml"
    - "!back-end/src/routes/**"
    - "!claude-code-src/**"

