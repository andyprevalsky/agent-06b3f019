<!doctype html>
<!--
  Rose script page, generated by the `display` tool for a .js / .mjs file.
  Served from the sandboxed usercontent origin next to the script, which runs as
  an ES module. The import map makes `import * as THREE from 'three'` and
  `import { OrbitControls } from 'three/addons/controls/OrbitControls.js'` work
  (three.js pinned, from jsDelivr); any other module can be imported by URL.
  The body is a full-viewport, margin-free host: append a canvas (or any DOM) to
  document.body and size it to window.innerWidth × window.innerHeight. A module
  that exports a default (or `mount`) function instead is called with
  #rose-root, a full-window element, once it has loaded.
  State for hosts and tests: <html data-state="loading|ready|error">. "ready"
  after the module evaluates without throwing (a page may set it itself
  earlier); any uncaught error or rejection shows on the page and sets "error".
-->
<html lang="en" data-state="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Script</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: #0b0b10; color: #e9e9f1;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  body > canvas, #rose-root > canvas { display: block; }
  #rose-root { position: fixed; inset: 0; }
  #rose-root:empty { pointer-events: none; }
  #rose-script-error {
    display: none; position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 2147483647;
    margin: 0; padding: 10px 12px; border-radius: 8px; white-space: pre-wrap; overflow: auto; max-height: 40%;
    background: rgba(60, 10, 14, 0.92); color: #ffb4b4; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  html[data-state="error"] #rose-script-error { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
  }
}
</script>
<script id="rose-config" type="application/json">__ROSE_CONFIG__</script>
<script>
(() => {
  const config = JSON.parse(document.getElementById('rose-config').textContent);
  document.title = config.title;
  const root = document.documentElement;
  const notify = (state, error) => {
    try { window.parent.postMessage({ type: 'rose:display', state, error }, '*'); } catch { /* no parent */ }
  };
  const fail = (message) => {
    root.dataset.state = 'error';
    const box = document.getElementById('rose-script-error');
    if (box) box.textContent += (box.textContent ? '\n' : '') + `${config.title}: ${message}`;
    notify('error', message);
  };
  const describe = (value) => (value && value.message ? value.message : String(value));
  window.addEventListener('error', (event) => fail(event.message || describe(event.error)));
  window.addEventListener('unhandledrejection', (event) => fail(describe(event.reason)));
  const url = new URL(config.src.split('/').map(encodeURIComponent).join('/'), location.href).href;
  window.addEventListener('DOMContentLoaded', () => {
    import(url)
      .then((mod) => {
        const mount = typeof mod.default === 'function' ? mod.default : mod.mount;
        return typeof mount === 'function' ? mount(document.getElementById('rose-root')) : undefined;
      })
      .then(
        () => { if (root.dataset.state === 'loading') { root.dataset.state = 'ready'; notify('ready'); } },
        (err) => fail(describe(err)),
      );
  });
})();
</script>
</head>
<body>
<div id="rose-root"></div>
<pre id="rose-script-error" role="alert"></pre>
</body>
</html>
