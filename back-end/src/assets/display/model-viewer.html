<!doctype html>
<!--
  Rose 3D model viewer, generated by the `display` tool for .glb/.gltf/.obj/.stl/.usdz.
  Served from the sandboxed usercontent origin next to the model file; three.js
  (pinned) loads from jsDelivr. Orbit controls (drag, scroll/pinch to zoom, right
  drag to pan), auto-framing, image-based lighting, glTF animations, auto-rotate
  until the first interaction (off under prefers-reduced-motion), paused while hidden.
  State for hosts and tests: <html data-state="loading|ready|error">.
-->
<html lang="en" data-state="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D model</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(120% 90% at 50% 35%, #2b2d3a 0%, #15161d 55%, #0b0b10 100%);
    color: #e9e9f1; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; outline: none; }
  canvas:active { cursor: grabbing; }
  #status { position: fixed; left: 14px; bottom: 12px; opacity: 0.72; pointer-events: none; letter-spacing: 0.01em; }
  html[data-state="ready"] #status { opacity: 0.45; }
  html[data-state="error"] #status { opacity: 1; color: #ff9b9b; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="status">Loading model…</div>
<script id="rose-config" type="application/json">__ROSE_CONFIG__</script>
<script type="module">
const config = JSON.parse(document.getElementById('rose-config').textContent);
const statusEl = document.getElementById('status');
const setState = (state, text) => {
  document.documentElement.dataset.state = state;
  statusEl.textContent = text;
  try { window.parent.postMessage({ type: 'rose:display', state, error: state === 'error' ? text : undefined }, '*'); } catch { /* no parent */ }
};
window.addEventListener('error', (event) => setState('error', `Could not show this model: ${event.message}`));

try {
  const THREE = await import('three');
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
  const { RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js');

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x30303a, 0.5));
  const key = new THREE.DirectionalLight(0xffffff, 1.4);
  key.position.set(3, 5, 4);
  scene.add(key);

  const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.01, 1000);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.autoRotate = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  controls.autoRotateSpeed = 1.1;
  controls.addEventListener('start', () => { controls.autoRotate = false; });

  const url = new URL(config.src.split('/').map(encodeURIComponent).join('/'), location.href).href;
  const neutral = () => new THREE.MeshStandardMaterial({ color: 0xc9ccd6, metalness: 0.15, roughness: 0.5 });
  let object;
  let animations = [];
  if (config.format === 'glb' || config.format === 'gltf') {
    const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
    const { DRACOLoader } = await import('three/addons/loaders/DRACOLoader.js');
    const { MeshoptDecoder } = await import('three/addons/libs/meshopt_decoder.module.js');
    const loader = new GLTFLoader();
    const draco = new DRACOLoader();
    draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
    loader.setDRACOLoader(draco);
    loader.setMeshoptDecoder(MeshoptDecoder);
    const gltf = await loader.loadAsync(url);
    object = gltf.scene;
    animations = gltf.animations || [];
  } else if (config.format === 'obj') {
    const { OBJLoader } = await import('three/addons/loaders/OBJLoader.js');
    const loader = new OBJLoader();
    const text = await (await fetch(url)).text();
    const mtl = /^\s*mtllib\s+(.+?)\s*$/m.exec(text);
    if (mtl) {
      const { MTLLoader } = await import('three/addons/loaders/MTLLoader.js');
      const materials = await new MTLLoader().loadAsync(new URL(mtl[1], url).href).catch(() => null);
      if (materials) { materials.preload(); loader.setMaterials(materials); }
    }
    object = loader.parse(text);
    if (!mtl) object.traverse((node) => { if (node.isMesh) node.material = neutral(); });
  } else if (config.format === 'stl') {
    const { STLLoader } = await import('three/addons/loaders/STLLoader.js');
    const geometry = await new STLLoader().loadAsync(url);
    geometry.computeVertexNormals();
    const material = geometry.hasColors ? new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.5 }) : neutral();
    object = new THREE.Mesh(geometry, material);
    object.rotation.x = -Math.PI / 2; // STL is Z-up
  } else if (config.format === 'usdz') {
    const { USDZLoader } = await import('three/addons/loaders/USDZLoader.js');
    object = await new USDZLoader().loadAsync(url);
  } else {
    throw new Error(`unsupported format .${config.format}`);
  }

  const pivot = new THREE.Group();
  pivot.add(object);
  scene.add(pivot);
  object.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(object);
  if (box.isEmpty()) throw new Error('the model has no geometry');
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  object.position.sub(center);
  const radius = Math.max(size.length() / 2, 1e-6);
  const distance = (radius / Math.sin(THREE.MathUtils.degToRad(camera.fov) / 2)) * 1.08;
  camera.near = distance / 200;
  camera.far = distance * 200;
  camera.position.set(0.62, 0.38, 0.78).normalize().multiplyScalar(distance);
  camera.updateProjectionMatrix();
  controls.target.set(0, 0, 0);
  controls.minDistance = radius * 0.05;
  controls.maxDistance = distance * 20;
  controls.update();

  const mixer = animations.length ? new THREE.AnimationMixer(object) : null;
  for (const clip of animations) mixer.clipAction(clip).play();
  const clock = new THREE.Clock();
  let triangles = 0;
  object.traverse((node) => {
    if (!node.isMesh || !node.geometry) return;
    const index = node.geometry.index;
    triangles += (index ? index.count : node.geometry.attributes.position.count) / 3;
  });

  const tick = () => {
    const dt = clock.getDelta();
    if (mixer) mixer.update(dt);
    controls.update();
    renderer.render(scene, camera);
  };
  const resize = () => {
    camera.aspect = window.innerWidth / Math.max(window.innerHeight, 1);
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  };
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => {
    renderer.setAnimationLoop(document.hidden ? null : tick);
    clock.getDelta();
  });
  renderer.setAnimationLoop(document.hidden ? null : tick);
  window.__roseModel = { format: config.format, triangles: Math.round(triangles), animations: animations.length };
  setState('ready', `${config.title} · drag to orbit, scroll to zoom`);
} catch (err) {
  setState('error', `Could not show this model: ${err && err.message ? err.message : err}`);
}
</script>
</body>
</html>
