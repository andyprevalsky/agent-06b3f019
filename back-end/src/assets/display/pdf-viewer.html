<!doctype html>
<!--
  Rose PDF viewer, generated by the `display` tool for .pdf files. Served from the
  sandboxed usercontent origin next to the PDF (Chromium's built-in viewer does not
  run in a sandboxed frame, so pages render with pdf.js, pinned, from jsDelivr; its
  worker starts from a blob: URL). "Open" shows the raw PDF in a new tab.
  State for hosts and tests: <html data-state="loading|ready|error">.
-->
<html lang="en" data-state="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #2a2b31; color: #ececf2; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 1; display: flex; gap: 12px; align-items: center; padding: 8px 14px; background: rgba(28, 29, 34, 0.92); backdrop-filter: blur(8px); }
  header .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 0.85; }
  header a { color: #b9c7ff; text-decoration: none; }
  main { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 14px; }
  canvas { max-width: 100%; height: auto; background: #fff; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35); }
  #status { opacity: 0.7; padding: 24px; }
</style>
</head>
<body>
<header><span class="title" id="title"></span><span id="pages"></span><a id="open" target="_blank" rel="noopener">Open</a></header>
<main id="doc"><div id="status">Loading PDF…</div></main>
<script id="rose-config" type="application/json">__ROSE_CONFIG__</script>
<script type="module">
const PDFJS = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/';
const config = JSON.parse(document.getElementById('rose-config').textContent);
const url = new URL(config.src.split('/').map(encodeURIComponent).join('/'), location.href).href;
const statusEl = document.getElementById('status');
document.getElementById('title').textContent = config.title;
document.getElementById('open').href = url;
const setState = (state, text) => {
  document.documentElement.dataset.state = state;
  if (text !== undefined) statusEl.textContent = text;
  try { window.parent.postMessage({ type: 'rose:display', state }, '*'); } catch { /* no parent */ }
};
try {
  const pdfjs = await import(`${PDFJS}pdf.min.mjs`);
  // An opaque-origin frame cannot start a cross-origin worker; a blob: worker inherits its origin.
  const workerSource = await (await fetch(`${PDFJS}pdf.worker.min.mjs`)).text();
  const workerUrl = URL.createObjectURL(new Blob([workerSource], { type: 'text/javascript' }));
  pdfjs.GlobalWorkerOptions.workerPort = new Worker(workerUrl, { type: 'module' });
  const pdf = await pdfjs.getDocument({ url, isEvalSupported: false }).promise;
  document.getElementById('pages').textContent = `${pdf.numPages} page${pdf.numPages === 1 ? '' : 's'}`;
  statusEl.remove();
  const doc = document.getElementById('doc');
  const width = Math.min(doc.clientWidth - 28, 1100);
  const scaleFor = (page) => (width / page.getViewport({ scale: 1 }).width) * Math.min(window.devicePixelRatio || 1, 2);
  const render = async (number) => {
    const page = await pdf.getPage(number);
    const viewport = page.getViewport({ scale: scaleFor(page) });
    const canvas = document.createElement('canvas');
    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);
    canvas.style.width = `${Math.floor(width)}px`;
    doc.append(canvas);
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  };
  await render(1);
  setState('ready');
  for (let n = 2; n <= pdf.numPages; n += 1) await render(n);
} catch (err) {
  setState('error', `Could not show this PDF: ${err && err.message ? err.message : err}`);
}
</script>
</body>
</html>
