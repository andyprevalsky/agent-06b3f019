<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>smoke inline</title>
<style>
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; }
  #out { padding: 18px; background: rgb(6, 95, 70); color: #fff; }
</style>
</head>
<body>
<div id="out">waiting for props</div>
<script>
  const out = document.getElementById('out');
  window.addEventListener('message', (event) => {
    if (!event.data || event.data.type !== 'rose:props') return;
    out.textContent = `props ${JSON.stringify(event.data.props)}`;
    document.documentElement.dataset.props = JSON.stringify(event.data.props);
  });
  parent.postMessage({ type: 'rose:ready' }, '*');
  parent.postMessage({ type: 'rose:resize', height: 120 }, '*');
</script>
</body>
</html>
