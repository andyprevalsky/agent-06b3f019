services:
  - type: web
    name: navi-agent-backend
    runtime: node
    repo: https://github.com/Rose-Ai-Labs/rose
    branch: main
    rootDir: back-end
    region: virginia
    plan: pro max
    numInstances: 1
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run prisma:migrate && npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=6144
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: http://localhost:8080,http://localhost:5173,http://127.0.0.1:8080,http://localhost:8081,https://www.roselabs.ai,https://roselabs.ai
      - key: BACKEND_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BACKEND_API_KEY
        sync: false
      - key: BROWSERBASE_API_KEY
        sync: false
      - key: BROWSERBASE_PROJECT_ID
        sync: false
      - key: BROWSER_PROVIDER
        value: browserbase
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
      - key: CDP_WALLET_SECRET
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: CLAUDE_CREDENTIAL_DECRYPTION_KEY
        sync: false
      - key: CURSOR_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DAYTONA_API_KEY
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: E2B_API_KEY
        sync: false
      - key: E2B_CLAUDE_CODE_TEMPLATE_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GMAIL_DESKTOP_CLIENT_ID
        sync: false
      - key: GMAIL_DESKTOP_SECRET_ID
        sync: false
      - key: GMAIL_WEB_CLIENT_ID
        sync: false
      - key: GMAIL_WEB_CLIENT_SECRET
        sync: false
      - key: HYPERBROWSER_API_KEY
        sync: false
      - key: LITHIC_API_KEY
        sync: false
      - key: MESSAGE_BIRD_EMAIL_ACCESS_KEY
        sync: false
      - key: MESSAGE_BIRD_SMS_ACCESS_KEY
        sync: false
